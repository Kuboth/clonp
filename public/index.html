<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#09090b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Clonp" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <title>Clonp — Debrid & Media Player</title>
  
  <!-- Fontes de Alta Fidelidade: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            brand: '#ef4444',
            zinc: {
              925: '#0c0c0e',
              950: '#09090b'
            }
          }
        }
      }
    }
  </script>

  <!-- FontAwesome & Plyr CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  
  <style>
    :root {
      --plyr-color-main: #ef4444;
    }
    html, body {
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #09090b;
      color: #fafafa;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      letter-spacing: -0.011em;
      min-height: 100dvh;
    }
    /* Touch target, callout and manipulation */
    button, a, input, select, textarea, [role="button"], .touch-target {
      touch-action: manipulation;
    }
    button, [role="button"], nav, .touch-target {
      -webkit-touch-callout: none;
      user-select: none;
    }
    /* iOS input auto-zoom prevention: ensure 16px minimum on touch */
    @media (pointer: coarse) {
      input, select, textarea, #urlInput {
        font-size: 16px !important;
      }
    }
    /* Sticky hover fix: only enable hover transformations when pointer is fine and hover is supported */
    @media (hover: none) and (pointer: coarse) {
      *:hover {
        background-color: initial !important;
        color: initial !important;
        border-color: initial !important;
        transform: none !important;
      }
      /* Maintain active tactile feedback on touch devices */
      button:active, a:active, [role="button"]:active {
        opacity: 0.75;
      }
    }
    .touch-target {
      min-height: 44px;
      min-width: 44px;
    }
    .plyr--video {
      border-radius: 0.75rem;
      overflow: hidden;
    }
    /* Contain overscroll on internal scroll areas */
    #recentLinksContainer, #breadcrumbs, #fileListContainer, #sortDropdown {
      overscroll-behavior: contain;
    }
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 4px;
    }
    /* Shimmer Skeleton */
    @keyframes shimmer {
      100% { transform: translateX(100%); }
    }
    .shimmer-bg {
      position: relative;
      overflow: hidden;
      background-color: #18181b;
    }
    .shimmer-bg::after {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      transform: translateX(-100%);
      background-image: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0,
        rgba(255, 255, 255, 0.03) 20%,
        rgba(255, 255, 255, 0.06) 60%,
        rgba(255, 255, 255, 0)
      );
      animation: shimmer 1.6s infinite;
      content: '';
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-[100dvh] flex flex-col font-sans antialiased selection:bg-zinc-800 selection:text-white pb-6">

  <!-- Header Minimalista Estilo Vercel/Linear -->
  <header class="border-b border-zinc-800/80 bg-zinc-950/75 backdrop-blur-xl sticky top-0 z-50 px-4 py-2.5">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2.5 cursor-pointer" onclick="window.location.reload()">
        <div class="w-7 h-7 rounded-lg bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-200">
          <i class="fa-solid fa-bolt text-xs text-brand"></i>
        </div>
        <div class="flex items-center space-x-1.5">
          <span class="font-semibold text-sm tracking-tight text-zinc-100">clonp</span>
          <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-zinc-900 text-zinc-400 border border-zinc-800">debrid</span>
        </div>
      </div>
      
      <div class="flex items-center space-x-2">
        <button id="pwaInstallBtn" class="hidden px-2.5 py-1 bg-zinc-900 hover:bg-zinc-850 text-zinc-300 border border-zinc-800 rounded-lg text-xs font-medium transition flex items-center space-x-1.5">
          <i class="fa-solid fa-download text-[10px]"></i>
          <span>App</span>
        </button>

        <div class="flex items-center space-x-1.5 bg-zinc-900/90 px-2.5 py-1 rounded-lg border border-zinc-800/80 text-[11px] text-zinc-400 font-mono">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
          <span>live</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto px-3.5 py-4 flex-1 w-full space-y-4">

    <!-- Omnibar Estilo Raycast / Spotlight -->
    <div class="bg-zinc-900/60 border border-zinc-800/90 rounded-2xl p-2.5 sm:p-3 shadow-xl backdrop-blur-sm relative transition-all focus-within:border-zinc-700 focus-within:bg-zinc-900/90">
      
      <div class="flex items-center justify-between px-1 mb-2">
        <div class="text-[11px] font-medium text-zinc-400 flex items-center space-x-1.5">
          <i class="fa-solid fa-arrow-turn-down text-[9px] text-zinc-500"></i>
          <span>Abrir link público MEGA</span>
        </div>
        <button id="toggleHistoryBtn" class="text-[11px] text-zinc-400 hover:text-zinc-200 flex items-center space-x-1 py-1 px-2 rounded-md bg-zinc-800/60 hover:bg-zinc-800 border border-zinc-750 transition cursor-pointer">
          <i class="fa-solid fa-clock-rotate-left text-[10px]"></i>
          <span>Recentes</span>
        </button>
      </div>

      <!-- Drawer de Links Recentes -->
      <div id="recentLinksContainer" class="hidden mb-2.5 p-2.5 bg-zinc-950/90 rounded-xl border border-zinc-800/80 space-y-1">
        <div class="text-[10px] font-semibold text-zinc-500 uppercase tracking-wider mb-1 flex items-center justify-between px-1">
          <span>Últimos links visitados</span>
          <button onclick="clearHistory()" class="text-zinc-500 hover:text-zinc-300 text-[10px] cursor-pointer">Limpar histórico</button>
        </div>
        <div id="recentLinksList" class="space-y-1 text-xs">
          <!-- Injetado via JS -->
        </div>
      </div>

      <form id="inspectForm" class="flex items-center gap-1.5">
        <div class="relative flex-1">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-zinc-500">
            <i class="fa-solid fa-link text-xs"></i>
          </div>
          <input 
            type="url" 
            id="urlInput"
            required
            inputmode="url"
            autocomplete="off"
            placeholder="https://mega.nz/file/..." 
            class="w-full pl-8 pr-3 py-2 bg-zinc-950 border border-zinc-800/90 rounded-xl focus:border-zinc-600 focus:outline-none transition-all placeholder:text-zinc-600 text-xs sm:text-sm font-mono text-zinc-200"
          />
        </div>
        <button 
          type="submit" 
          id="btnInspect"
          class="px-4 py-2 bg-zinc-100 hover:bg-white active:bg-zinc-200 text-zinc-950 font-semibold text-xs sm:text-sm rounded-xl transition flex items-center justify-center space-x-1.5 cursor-pointer touch-target flex-shrink-0 shadow-sm">
          <span>Explorar</span>
          <i class="fa-solid fa-arrow-right text-[10px]"></i>
        </button>
      </form>
      
      <!-- Erro -->
      <div id="errorBox" class="hidden mt-2.5 p-3 rounded-xl bg-red-950/30 border border-red-900/40 text-red-400 text-xs flex items-start space-x-2">
        <i class="fa-solid fa-circle-exclamation mt-0.5 text-xs"></i>
        <div id="errorMessage"></div>
      </div>
    </div>

    <!-- Shimmer Skeletons de carregamento (Substitui o spinner antigo) -->
    <div id="loadingBox" class="hidden grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2.5 py-1">
      <div class="shimmer-bg rounded-xl h-44 border border-zinc-800/60 p-2.5 flex flex-col justify-between">
        <div class="h-24 rounded-lg bg-zinc-800/50"></div>
        <div class="space-y-1.5">
          <div class="h-2.5 bg-zinc-800/60 rounded w-4/5"></div>
          <div class="h-2 bg-zinc-800/40 rounded w-1/2"></div>
        </div>
      </div>
      <div class="shimmer-bg rounded-xl h-44 border border-zinc-800/60 p-2.5 flex flex-col justify-between">
        <div class="h-24 rounded-lg bg-zinc-800/50"></div>
        <div class="space-y-1.5">
          <div class="h-2.5 bg-zinc-800/60 rounded w-3/4"></div>
          <div class="h-2 bg-zinc-800/40 rounded w-2/5"></div>
        </div>
      </div>
      <div class="shimmer-bg rounded-xl h-44 border border-zinc-800/60 p-2.5 flex flex-col justify-between">
        <div class="h-24 rounded-lg bg-zinc-800/50"></div>
        <div class="space-y-1.5">
          <div class="h-2.5 bg-zinc-800/60 rounded w-5/6"></div>
          <div class="h-2 bg-zinc-800/40 rounded w-1/3"></div>
        </div>
      </div>
      <div class="shimmer-bg rounded-xl h-44 border border-zinc-800/60 p-2.5 flex flex-col justify-between">
        <div class="h-24 rounded-lg bg-zinc-800/50"></div>
        <div class="space-y-1.5">
          <div class="h-2.5 bg-zinc-800/60 rounded w-2/3"></div>
          <div class="h-2 bg-zinc-800/40 rounded w-1/2"></div>
        </div>
      </div>
    </div>

    <!-- Resultados e Navegador -->
    <div id="resultsBox" class="hidden space-y-2.5">
      
      <!-- Barra Superior: Breadcrumbs minimalista -->
      <div class="bg-zinc-900/40 p-2.5 rounded-xl border border-zinc-800/80 flex items-center justify-between gap-2 overflow-x-auto">
        <nav id="breadcrumbs" class="flex items-center gap-1.5 text-xs text-zinc-400 font-medium whitespace-nowrap overflow-x-auto py-0.5">
          <!-- Início / Pasta ... -->
        </nav>
      </div>

      <!-- Barra de Ferramentas Refinada -->
      <div class="flex items-center justify-between gap-2">
        <!-- Lado Esquerdo: Menu Ordenar por + Botão Seleção -->
        <div class="flex items-center gap-1.5">
          <div class="relative">
            <button 
              id="sortMenuBtn"
              class="px-2.5 py-1.5 bg-zinc-900 hover:bg-zinc-850 border border-zinc-800 rounded-lg text-xs font-medium text-zinc-300 transition inline-flex items-center space-x-1.5 cursor-pointer touch-target shadow-sm">
              <i class="fa-solid fa-arrow-down-short-wide text-zinc-400 text-xs"></i>
              <span id="currentSortLabel">Nome</span>
              <i class="fa-solid fa-chevron-down text-[9px] text-zinc-500 ml-0.5"></i>
            </button>

            <!-- Dropdown Ordenar por -->
            <div 
              id="sortDropdown" 
              class="hidden absolute left-0 mt-1.5 w-48 bg-zinc-900 border border-zinc-800 rounded-xl shadow-2xl z-40 py-1.5 divide-y divide-zinc-800 font-sans">
              
              <div class="px-3 py-1 text-[10px] font-semibold text-zinc-500 uppercase tracking-wider">
                Ordenar por
              </div>

              <div class="py-1 text-xs text-zinc-300">
                <button onclick="changeSort('name')" class="w-full px-3 py-2 text-left hover:bg-zinc-800 flex items-center justify-between transition cursor-pointer">
                  <span>Nome</span>
                  <i id="check_name" class="fa-solid fa-check text-zinc-100 text-xs"></i>
                </button>
                <button onclick="changeSort('date_desc')" class="w-full px-3 py-2 text-left hover:bg-zinc-800 flex items-center justify-between transition cursor-pointer">
                  <span>Data de inclusão</span>
                  <i id="check_date_desc" class="fa-solid fa-check text-zinc-100 text-xs hidden"></i>
                </button>
                <button onclick="changeSort('date_asc')" class="w-full px-3 py-2 text-left hover:bg-zinc-800 flex items-center justify-between transition cursor-pointer">
                  <span>Última alteração</span>
                  <i id="check_date_asc" class="fa-solid fa-check text-zinc-100 text-xs hidden"></i>
                </button>
                <button onclick="changeSort('type')" class="w-full px-3 py-2 text-left hover:bg-zinc-800 flex items-center justify-between transition cursor-pointer">
                  <span>Tipo</span>
                  <i id="check_type" class="fa-solid fa-check text-zinc-100 text-xs hidden"></i>
                </button>
                <button onclick="changeSort('size')" class="w-full px-3 py-2 text-left hover:bg-zinc-800 flex items-center justify-between transition cursor-pointer">
                  <span>Tamanho</span>
                  <i id="check_size" class="fa-solid fa-check text-zinc-100 text-xs hidden"></i>
                </button>
                <button onclick="changeSort('duration')" class="w-full px-3 py-2 text-left hover:bg-zinc-800 flex items-center justify-between transition cursor-pointer">
                  <span>Duração / Extensão</span>
                  <i id="check_duration" class="fa-solid fa-check text-zinc-100 text-xs hidden"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Botão Ativar Seleção em Lote -->
          <button 
            id="toggleSelectModeBtn"
            onclick="toggleSelectMode()"
            class="px-2.5 py-1.5 bg-zinc-900 border border-zinc-800 hover:border-zinc-700 rounded-lg text-xs text-zinc-400 hover:text-zinc-200 transition touch-target flex items-center space-x-1.5 cursor-pointer">
            <i class="fa-solid fa-list-check text-xs"></i>
            <span class="hidden sm:inline">Selecionar</span>
          </button>
        </div>

        <!-- Lado Direito: Alternador Lista/Grade + Botão Direção -->
        <div class="flex items-center gap-1.5">
          <!-- Alternador de Visualização (Lista vs Grade) -->
          <div class="flex items-center bg-zinc-900 border border-zinc-800 rounded-lg p-0.5">
            <button 
              id="viewListBtn"
              onclick="setViewMode('list')" 
              title="Modo Lista"
              class="w-7 h-7 rounded-md flex items-center justify-center text-xs transition bg-zinc-800 text-zinc-100 shadow-sm">
              <i class="fa-solid fa-list"></i>
            </button>
            <button 
              id="viewGridBtn"
              onclick="setViewMode('grid')" 
              title="Modo Grade"
              class="w-7 h-7 rounded-md flex items-center justify-center text-xs transition text-zinc-500 hover:text-zinc-300">
              <i class="fa-solid fa-grip"></i>
            </button>
          </div>

          <!-- Botão Rápido de Direção: Crescente / Decrescente -->
          <button 
            id="quickDirectionBtn"
            onclick="toggleSortDirection()" 
            title="Alternar Ordem (Crescente / Decrescente)"
            class="w-8 h-8 bg-zinc-900 hover:bg-zinc-850 active:bg-zinc-800 border border-zinc-800 rounded-lg flex items-center justify-center text-zinc-300 hover:text-white transition shadow-sm touch-target">
            <i id="quickDirectionIcon" class="fa-solid fa-arrow-up-a-z text-xs text-zinc-300"></i>
          </button>
        </div>
      </div>

      <!-- Barra Flutuante de Ação em Lote -->
      <div id="batchActionToolbar" class="hidden bg-zinc-900 border border-zinc-750 rounded-xl p-2.5 flex items-center justify-between text-xs animate-fade-in shadow-lg">
        <div class="flex items-center space-x-2 pl-1">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          <span id="selectedCountText" class="font-medium text-zinc-200">0 selecionados</span>
        </div>
        <div class="flex items-center space-x-1.5">
          <button onclick="selectAllCurrentFolder()" class="px-2.5 py-1 bg-zinc-800 hover:bg-zinc-750 text-zinc-300 rounded-md cursor-pointer">Todos</button>
          <button onclick="downloadSelectedBatch()" class="px-3 py-1 bg-zinc-100 hover:bg-white text-zinc-950 font-semibold rounded-md shadow-sm flex items-center space-x-1 cursor-pointer">
            <i class="fa-solid fa-file-zipper text-xs"></i>
            <span>Baixar (.ZIP)</span>
          </button>
        </div>
      </div>

      <!-- Lista / Grade de Arquivos -->
      <div id="fileListContainer" class="space-y-1.5">
        <!-- Itens injetados via JS -->
      </div>

    </div>

    <!-- Modal de Visualizador Tela Cheia (Swipe Gallery & Resumo de Vídeo) -->
    <div id="mediaModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-0 bg-black/95 backdrop-blur-md" style="overscroll-behavior: contain;">
      <div class="bg-zinc-950 sm:border border-zinc-800 rounded-none sm:rounded-2xl max-w-5xl w-full h-[100dvh] sm:h-auto sm:max-h-[92dvh] p-2 sm:p-4 relative shadow-2xl flex flex-col justify-between">
        
        <!-- Barra de Topo do Modal -->
        <div class="flex items-center justify-between border-b border-zinc-800 px-2 py-2">
          <div class="flex items-center space-x-2 truncate pr-3">
            <span class="p-1 rounded bg-zinc-800 text-zinc-300 text-[10px] font-mono uppercase tracking-wider">Player</span>
            <h3 id="modalTitle" class="font-medium text-xs sm:text-sm text-zinc-200 truncate">Reproduzindo</h3>
          </div>
          <button id="closeModalBtn" class="text-zinc-400 hover:text-white p-1.5 rounded-lg touch-target flex items-center justify-center bg-zinc-900 border border-zinc-800 active:bg-zinc-800 cursor-pointer">
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>
        
        <!-- Área Central de Exibição Expandida -->
        <div id="mediaPlayerWrapper" class="w-full flex-1 bg-black flex items-center justify-center overflow-hidden my-auto min-h-[320px] relative">
          <!-- Player ou Imagem injetada via JS -->
        </div>

        <!-- Controles de Galeria (Anterior / Próximo) e Download -->
        <div class="flex items-center justify-between px-2 pt-2 text-xs border-t border-zinc-800">
          <div class="flex items-center space-x-1">
            <button onclick="navigateGallery(-1)" class="p-2 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-300 hover:text-white cursor-pointer" title="Item Anterior">
              <i class="fa-solid fa-chevron-left text-xs"></i>
            </button>
            <span id="galleryCounter" class="text-[11px] text-zinc-500 px-2 font-mono">1 / 1</span>
            <button onclick="navigateGallery(1)" class="p-2 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-300 hover:text-white cursor-pointer" title="Próximo Item">
              <i class="fa-solid fa-chevron-right text-xs"></i>
            </button>
          </div>

          <a id="modalDownloadBtn" href="#" download class="text-zinc-950 font-medium flex items-center space-x-1.5 py-1.5 px-3 rounded-lg bg-zinc-100 hover:bg-white active:bg-zinc-200 text-xs shadow-sm cursor-pointer">
            <i class="fa-solid fa-download text-[11px]"></i>
            <span>Baixar arquivo</span>
          </a>
        </div>
      </div>
    </div>

    <!-- Toast de Notificação Minimalista -->
    <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-zinc-900 border border-zinc-750 text-zinc-200 px-3.5 py-2 rounded-xl shadow-2xl text-xs flex items-center space-x-2 z-50 whitespace-nowrap">
      <i class="fa-solid fa-circle-check text-emerald-400 text-xs"></i>
      <span id="toastMsg" class="font-medium">Notificação</span>
    </div>

  </main>

  <!-- Plyr JS, StreamSaver.js, idb-keyval, Hls.js & Shaka Polyfills -->
  <script src="https://cdn.jsdelivr.net/npm/idb-keyval@6/dist/iife.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/streamsaver@2.0.6/StreamSaver.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

  <script>
    // Registro do Service Worker (PWA)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

    let deferredPrompt = null;
    const pwaInstallBtn = document.getElementById('pwaInstallBtn');

    // Detecta se já está rodando em modo App (Standalone)
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (!isStandalone) {
      // Exibe botão de instalação para facilitar acesso tanto no Android quanto no iOS
      pwaInstallBtn.classList.remove('hidden');
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      pwaInstallBtn.classList.remove('hidden');
    });

    pwaInstallBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          pwaInstallBtn.classList.add('hidden');
        }
        deferredPrompt = null;
      } else {
        // Instrução visual para iOS / navegadores sem suporte ao evento direto
        const isIos = /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
        if (isIos) {
          showToast('Toque em Compartilhar e depois "Adicionar à Tela de Início"');
        } else {
          showToast('Abra as opções do navegador (⋮) e toque em "Instalar aplicativo"');
        }
      }
    });

    const inspectForm = document.getElementById('inspectForm');
    const urlInput = document.getElementById('urlInput');
    const btnInspect = document.getElementById('btnInspect');
    const loadingBox = document.getElementById('loadingBox');
    const resultsBox = document.getElementById('resultsBox');
    const errorBox = document.getElementById('errorBox');
    const errorMessage = document.getElementById('errorMessage');
    const fileListContainer = document.getElementById('fileListContainer');
    const breadcrumbs = document.getElementById('breadcrumbs');

    const sortMenuBtn = document.getElementById('sortMenuBtn');
    const sortDropdown = document.getElementById('sortDropdown');

    function saveRecentLink(url, title) {
      let recent = JSON.parse(localStorage.getItem('clonp_recent_links') || '[]');
      recent = recent.filter(r => r.url !== url);
      recent.unshift({ url, title: title || url, date: Date.now() });
      if (recent.length > 6) recent.pop();
      localStorage.setItem('clonp_recent_links', JSON.stringify(recent));
      renderRecentLinks();
    }

    function sortItems(items) {
      return [...items].sort((a, b) => {
        if (a.isDirectory && !b.isDirectory) return -1;
        if (!a.isDirectory && b.isDirectory) return 1;

        let result = 0;
        switch (currentSortBy) {
          case 'name':
            result = a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
            break;
          case 'date_desc':
            result = (b.timestamp || 0) - (a.timestamp || 0);
            break;
          case 'date_asc':
            result = (a.timestamp || 0) - (b.timestamp || 0);
            break;
          case 'type':
            result = (a.extension || '').localeCompare(b.extension || '');
            break;
          case 'size':
            result = (a.size || 0) - (b.size || 0);
            break;
          case 'duration':
            result = (a.extension || '').localeCompare(b.extension || '');
            break;
          default:
            result = a.name.localeCompare(b.name);
        }

        return isAscending ? result : -result;
      });
    }

    function getFileIcon(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      if (['mp4', 'mkv', 'avi', 'mov', 'webm', 'm4v', '3gp', 'flv', 'wmv', 'ts'].includes(ext)) return 'fa-film text-zinc-400';
      if (['mp3', 'wav', 'flac', 'aac', 'ogg', 'm4a', 'wma', 'opus'].includes(ext)) return 'fa-headphones text-zinc-400';
      if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp', 'ico', 'tiff', 'heic', 'avif'].includes(ext)) return 'fa-image text-zinc-400';
      if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) return 'fa-box-archive text-zinc-400';
      if (['pdf'].includes(ext)) return 'fa-file-lines text-zinc-400';
      if (['srt', 'vtt'].includes(ext)) return 'fa-closed-captioning text-zinc-400';
      return 'fa-file text-zinc-500';
    }

    function isViewable(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      return isImage(filename) || isVideo(filename) || isAudio(filename) || isPdf(filename) || ['txt', 'log', 'json', 'md', 'xml'].includes(ext);
    }

    function isImage(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      return ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp', 'ico', 'tiff', 'avif', 'heic'].includes(ext);
    }

    function isVideo(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      return ['mp4', 'webm', 'mov', 'm4v', 'mkv', 'avi', '3gp', 'ogv'].includes(ext);
    }

    function isPdf(filename) {
      return filename.toLowerCase().endsWith('.pdf');
    }

    function isAudio(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      return ['mp3', 'wav', 'ogg', 'm4a', 'aac', 'flac', 'opus'].includes(ext);

    // Fila sequencial e controlada para gerar miniaturas de vídeo com cache em 2 camadas (LRU em RAM + IndexedDB permanente)
    const videoThumbQueue = [];
    let isProcessingVideoThumb = false;
    const videoThumbCache = new Map(); // Camada 1: RAM (LRU)
    const imgThumbCache = new Map();   // Cache de imagens em RAM

    // Carregador com cache em IndexedDB para imagens
    async function loadCachedImage(imgElement, streamUrl, fileId) {
      if (!fileId) {
        imgElement.src = streamUrl;
        return;
      }

      // 1. Memória RAM
      if (imgThumbCache.has(fileId)) {
        imgElement.src = imgThumbCache.get(fileId);
        return;
      }

      // 2. IndexedDB (Persistente no navegador)
      try {
        if (window.idbKeyval) {
          const cachedBlob = await idbKeyval.get(`img_${fileId}`);
          if (cachedBlob) {
            const objectUrl = URL.createObjectURL(cachedBlob);
            imgThumbCache.set(fileId, objectUrl);
            imgElement.src = objectUrl;
            return;
          }
        }
      } catch (e) {}

      // 3. Busca da rede e salva no IndexedDB
      try {
        const resp = await fetch(streamUrl);
        if (resp.ok) {
          const blob = await resp.blob();
          const objectUrl = URL.createObjectURL(blob);
          imgThumbCache.set(fileId, objectUrl);
          imgElement.src = objectUrl;
          if (window.idbKeyval && blob.size < 5 * 1024 * 1024) { // salva se for menor que 5MB
            idbKeyval.set(`img_${fileId}`, blob).catch(() => {});
          }
        } else {
          imgElement.src = streamUrl;
        }
      } catch (err) {
        imgElement.src = streamUrl;
      }
    }

    const videoThumbObserver = new IntersectionObserver((entries, observer) => {
      entries.forEach(async (entry) => {
        if (!entry.isIntersecting) return;
        const container = entry.target;
        observer.unobserve(container);

        const videoId = container.dataset.videoId;
        if (!videoId) return;

        // 1. Verifica no Cache de Memória RAM (0ms)
        if (videoThumbCache.has(videoId)) {
          const cached = videoThumbCache.get(videoId);
          if (typeof cached === 'object' && cached.thumbUrl) {
            applyVideoThumb(container, cached.thumbUrl, cached.isVertical);
          } else {
            applyVideoThumb(container, cached, false);
          }
          return;
        }

        // 2. Verifica no Armazenamento Permanente IndexedDB (idb-keyval)
        try {
          if (window.idbKeyval) {
            const cachedDb = await idbKeyval.get(`thumb_${videoId}`);
            if (cachedDb) {
              videoThumbCache.set(videoId, cachedDb);
              if (typeof cachedDb === 'object' && cachedDb.thumbUrl) {
                applyVideoThumb(container, cachedDb.thumbUrl, cachedDb.isVertical);
              } else {
                applyVideoThumb(container, cachedDb, false);
              }
              return;
            }
          }
        } catch (e) {}

        // 3. Se não tem em nenhum dos caches, adiciona na fila de geração client-side
        videoThumbQueue.push({ videoId, container });
        processNextVideoThumb();
      });
    }, { rootMargin: '120px' });

    function applyVideoThumb(container, dataUrl, isVertical = false) {
      const badgeHtml = isVertical 
        ? `<div class="absolute bottom-1 right-1 bg-black/75 backdrop-blur-sm px-1 py-0.5 rounded text-[8px] text-zinc-300 font-mono leading-none border border-zinc-700/60 flex items-center space-x-0.5">
             <i class="fa-solid fa-mobile-screen-button text-[7px] text-zinc-400"></i>
             <span>9:16</span>
           </div>`
        : `<div class="absolute bottom-1 right-1 bg-black/75 backdrop-blur-sm px-1 py-0.5 rounded text-[8px] text-zinc-400 font-mono leading-none border border-zinc-700/60">
             16:9
           </div>`;

      container.innerHTML = `
        <img src="${dataUrl}" class="w-full h-full object-cover transition-opacity duration-300 opacity-0" onload="this.classList.remove('opacity-0')">
        ${badgeHtml}
      `;
    }

    function processNextVideoThumb() {
      if (isProcessingVideoThumb || videoThumbQueue.length === 0) return;
      isProcessingVideoThumb = true;

      const { videoId, container } = videoThumbQueue.shift();
      const video = document.createElement('video');
      video.muted = true;
      video.playsInline = true;
      video.preload = 'auto';

      let cleanedUp = false;
      const cleanup = () => {
        if (cleanedUp) return;
        cleanedUp = true;
        video.src = '';
        video.load();
        video.remove();
        isProcessingVideoThumb = false;
        setTimeout(processNextVideoThumb, 40);
      };

      const timeout = setTimeout(cleanup, 5000);

      const captureFrame = () => {
        try {
          const vw = video.videoWidth || 16;
          const vh = video.videoHeight || 9;
          if (!video.videoWidth || !video.videoHeight) {
            clearTimeout(timeout);
            cleanup();
            return;
          }
          const isVertical = vh > vw;

          const canvas = document.createElement('canvas');
          if (isVertical) {
            canvas.width = 135;
            canvas.height = 240;
          } else {
            canvas.width = 240;
            canvas.height = 135;
          }
          const ctx = canvas.getContext('2d');
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const thumbUrl = canvas.toDataURL('image/jpeg', 0.65);
          
          const cachePayload = { thumbUrl, isVertical };

          if (videoThumbCache.size > 150) {
            const firstKey = videoThumbCache.keys().next().value;
            videoThumbCache.delete(firstKey);
          }
          videoThumbCache.set(videoId, cachePayload);

          if (window.idbKeyval) {
            idbKeyval.set(`thumb_${videoId}`, cachePayload).catch(() => {});
          }

          applyVideoThumb(container, thumbUrl, isVertical);
        } catch (e) {}
        clearTimeout(timeout);
        cleanup();
      };

      video.addEventListener('loadeddata', () => {
        if (video.duration && !isNaN(video.duration)) {
          video.currentTime = Math.min(1.0, video.duration * 0.1);
        } else {
          captureFrame();
        }
      }, { once: true });

      video.addEventListener('seeked', () => {
        captureFrame();
      }, { once: true });

      video.addEventListener('error', () => {
        clearTimeout(timeout);
        cleanup();
      }, { once: true });

      video.src = `${window.location.origin}/api/stream/${videoId}`;
    }

    function renderBreadcrumbs() {
      breadcrumbs.innerHTML = '';
      pathStack.forEach((entry, index) => {
        const isLast = index === pathStack.length - 1;
        const item = document.createElement('div');
        item.className = 'flex items-center space-x-1 flex-shrink-0';

        if (index > 0) {
          const sep = document.createElement('span');
          sep.className = 'text-zinc-600 text-[11px] px-0.5';
          sep.textContent = '/';
          item.appendChild(sep);
        }

        if (isLast) {
          const span = document.createElement('span');
          span.className = 'text-zinc-100 font-medium flex items-center space-x-1.5 bg-zinc-850 px-2 py-0.5 rounded-md border border-zinc-750 text-xs';
          span.innerHTML = `<i class="fa-solid fa-folder-open text-zinc-400 text-[11px]"></i> <span class="max-w-[120px] truncate">${entry.name}</span>`;
          item.appendChild(span);
        } else {

          btn.className = 'text-zinc-400 hover:text-zinc-200 transition flex items-center space-x-1 cursor-pointer py-0.5 px-1';
          btn.innerHTML = `<span class="max-w-[90px] truncate">${entry.name}</span>`;
          btn.onclick = () => {
            pathStack = pathStack.slice(0, index + 1);
            currentFolderNode = entry.node;
            renderBreadcrumbs();
            renderFolder(currentFolderNode);
          };
          item.appendChild(btn);
        }

        breadcrumbs.appendChild(item);
      });

      breadcrumbs.scrollLeft = breadcrumbs.scrollWidth;
    }

    let renderedItemsLimit = 40; // Renderiza os primeiros 40 arquivos para carga instantânea
    let currentFolderChildren = [];

    // Scroll infinito para carregar mais itens suavemente sem travar o celular
    window.addEventListener('scroll', () => {
      if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
        if (renderedItemsLimit < currentFolderChildren.length) {
          renderedItemsLimit += 40;
          appendMoreItems();
        }
      }
    }, { passive: true });

    function appendMoreItems() {
      const slice = currentFolderChildren.slice(renderedItemsLimit - 40, renderedItemsLimit);
      slice.forEach(item => {
        const card = createItemCard(item);
        fileListContainer.appendChild(card);
      });
    }

    function renderFolder(folderNode) {
      fileListContainer.innerHTML = '';
      currentFolderChildren = folderNode.children || [];
      currentFolderChildren = sortItems(currentFolderChildren);
      renderedItemsLimit = 40;

      // Atualiza lista de itens visualizáveis para a galeria swipe
      viewableItemsList = currentFolderChildren.filter(c => !c.isDirectory && isViewable(c.name));

      // Botão "Voltar"
      if (pathStack.length > 1) {
        const backCard = document.createElement('div');
        if (currentViewMode === 'grid') {
          backCard.className = 'col-span-full bg-zinc-900/40 hover:bg-zinc-850/70 border border-zinc-800 rounded-lg p-2 flex items-center space-x-2 cursor-pointer text-zinc-300 active:scale-[0.99] transition touch-target';
          backCard.innerHTML = `
            <div class="w-6 h-6 rounded-md bg-zinc-800 flex items-center justify-center text-zinc-300">
              <i class="fa-solid fa-arrow-turn-up text-[10px]"></i>
            </div>
            <span class="font-medium text-xs text-zinc-300">.. Voltar pasta</span>
          `;
        } else {
          backCard.className = 'p-2.5 flex items-center space-x-2.5 cursor-pointer text-zinc-300 hover:bg-zinc-850/40 active:scale-[0.99] transition touch-target border-b border-zinc-850';
          backCard.innerHTML = `
            <div class="w-6 h-6 rounded-md bg-zinc-800 flex items-center justify-center text-zinc-300">
              <i class="fa-solid fa-arrow-turn-up text-[10px]"></i>
            </div>
            <span class="font-medium text-xs text-zinc-300">.. Voltar pasta</span>
          `;
        }
        backCard.onclick = () => {
          pathStack.pop();
          currentFolderNode = pathStack[pathStack.length - 1].node;
          renderBreadcrumbs();
          renderFolder(currentFolderNode);
        };
        fileListContainer.appendChild(backCard);
      }

      if (!currentFolderChildren.length) {
        const empty = document.createElement('div');
        empty.className = 'col-span-full py-12 text-center text-zinc-500 text-xs bg-zinc-900/20 rounded-xl border border-dashed border-zinc-800';
        empty.textContent = 'Esta pasta está vazia.';
        fileListContainer.appendChild(empty);
        return;
      }

      const initialBatch = currentFolderChildren.slice(0, renderedItemsLimit);
      initialBatch.forEach(item => {
        const card = createItemCard(item);
        fileListContainer.appendChild(card);
      });
    }

    function createItemCard(item) {
      const card = document.createElement('div');
      const iconClass = getFileIcon(item.name);
      const canView = isViewable(item.name);
      const isImg = isImage(item.name);
      const isVid = isVideo(item.name);
      const fullStreamUrl = `${window.location.origin}/api/stream/${item.id}`;
      const isSelected = selectedItemIds.has(item.id);

      if (currentViewMode === 'grid') {
        card.className = `bg-zinc-900/60 border ${isSelected ? 'border-zinc-200 ring-1 ring-zinc-200' : 'border-zinc-800/90'} rounded-xl p-2.5 flex flex-col justify-between transition hover:border-zinc-700 active:scale-[0.98] select-none cursor-pointer group shadow-sm relative`;

        if (item.isDirectory) {
          card.onclick = () => enterFolder(item.id);
          card.innerHTML = `
            <div class="flex flex-col items-center text-center py-2 flex-1 justify-center">
              <div class="w-12 h-12 rounded-xl bg-zinc-800/80 border border-zinc-750 flex items-center justify-center text-zinc-300 mb-2 group-hover:scale-105 transition">
                <i class="fa-solid fa-folder text-xl"></i>
              </div>
              <div class="font-medium text-xs text-zinc-200 line-clamp-2 w-full break-words leading-tight" title="${item.name}">${item.name}</div>
              <div class="text-[10px] text-zinc-500 font-mono mt-1">${item.children ? item.children.length + ' item(ns)' : 'Pasta'}</div>
            </div>
          `;
        } else {
          card.onclick = () => {
            if (isSelectionMode) {
              if (selectedItemIds.has(item.id)) selectedItemIds.delete(item.id);
              else selectedItemIds.add(item.id);
              updateBatchUI();
              renderFolder(currentFolderNode);
              return;
            }
            if (canView) {
              openPlayer(item.id, encodeURIComponent(item.name), item.subtitleId || '');
            } else {
              window.location.href = `/api/stream/${item.id}?download=1`;
            }
          };

          let thumbnailHtml = '';
          if (isImg) {
            thumbnailHtml = `
              <div class="w-full h-28 rounded-lg overflow-hidden bg-zinc-950 border border-zinc-800/90 flex items-center justify-center mb-2 relative group-hover:border-zinc-700 transition">
                <img data-img-stream="${fullStreamUrl}" data-file-id="${item.id}" alt="${item.name}" loading="lazy" decoding="async" class="cached-img-target w-full h-full object-cover" onerror="this.parentElement.innerHTML='<div class=\\'flex flex-col items-center justify-center text-zinc-500 text-[10px]\\'><i class=\\'fa-solid fa-image text-xl mb-1 text-zinc-600\\'></i><span>IMG</span></div>'">
                <div class="absolute bottom-1 right-1 bg-black/70 backdrop-blur-sm px-1 py-0.5 rounded text-[9px] text-zinc-300 font-mono leading-none">
                  IMG
                </div>
              </div>`;
          } else if (isVid) {
            thumbnailHtml = `
              <div class="video-thumb-container w-full h-28 rounded-lg overflow-hidden bg-zinc-950 border border-zinc-800/90 flex flex-col items-center justify-center mb-2 relative group-hover:border-zinc-700 transition" data-video-id="${item.id}">
                <div class="w-9 h-9 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-400 flex items-center justify-center mb-1 group-hover:scale-110 transition">
                  <i class="fa-solid fa-play text-xs"></i>
                </div>
                <span class="text-[9px] text-zinc-500 uppercase font-mono tracking-wider">${item.extension || 'VIDEO'}</span>
              </div>`;
          } else if (isPdf(item.name)) {
            thumbnailHtml = `
              <div class="w-full h-28 rounded-lg bg-zinc-950 border border-zinc-800/90 flex flex-col items-center justify-center mb-2 relative group-hover:border-zinc-700 transition">
                <i class="fa-solid fa-file-lines text-2xl text-zinc-400 mb-1"></i>
                <span class="text-[9px] text-zinc-500 font-mono uppercase tracking-wider">PDF</span>
              </div>`;
          } else {
            thumbnailHtml = `
              <div class="w-full h-28 rounded-lg bg-zinc-950 border border-zinc-800/90 flex flex-col items-center justify-center mb-2 relative group-hover:border-zinc-700 transition">
                <i class="fa-solid ${iconClass} text-2xl mb-1"></i>
                <span class="text-[9px] text-zinc-500 uppercase font-mono">${item.extension || 'FILE'}</span>
              </div>`;
          }

          const checkMark = isSelectionMode 
            ? `<div class="absolute top-2 left-2 w-4 h-4 rounded ${isSelected ? 'bg-zinc-100 text-zinc-950' : 'bg-black/60 text-transparent border border-white/40'} flex items-center justify-center text-[10px]">
                 <i class="fa-solid fa-check"></i>
               </div>`
            : '';

          card.innerHTML = `
            ${checkMark}
            <div class="flex flex-col items-center text-center py-0.5 flex-1 justify-center min-w-0">
              ${thumbnailHtml}
              <div class="font-medium text-[11px] text-zinc-200 line-clamp-2 w-full break-words leading-tight" title="${item.name}">${item.name}</div>
              <div class="text-[10px] text-zinc-500 font-mono mt-1">${item.formattedSize}</div>
            </div>

            <div class="pt-2 border-t border-zinc-800/80 mt-1" onclick="event.stopPropagation()">
              <button 
                onclick="triggerDownload('${item.id}')"
                title="Baixar Arquivo"
                class="w-full py-1.5 bg-zinc-850 hover:bg-zinc-800 active:bg-zinc-750 text-zinc-300 hover:text-white border border-zinc-750 rounded-lg text-[11px] font-medium transition flex items-center justify-center space-x-1 cursor-pointer">
                <i class="fa-solid fa-download text-[10px]"></i>
                <span>Baixar</span>
              </button>
            </div>
          `;
        }

      } else {
        // Modo Lista
        card.className = `p-2.5 flex items-center justify-between gap-3 hover:bg-zinc-850/40 ${isSelected ? 'bg-zinc-800/60' : ''} active:bg-zinc-850/70 transition cursor-pointer select-none`;

        if (item.isDirectory) {
          card.onclick = () => enterFolder(item.id);
          card.innerHTML = `
            <div class="flex items-center space-x-2.5 min-w-0 flex-1">
              <div class="w-7 h-7 rounded-lg bg-zinc-800 border border-zinc-750 text-zinc-300 flex items-center justify-center flex-shrink-0">
                <i class="fa-solid fa-folder text-xs"></i>
              </div>
              <div class="min-w-0 flex-1">
                <div class="font-medium text-xs sm:text-sm text-zinc-200 truncate">${item.name}</div>
                <div class="text-[10px] text-zinc-500 font-mono">${item.children ? item.children.length + ' item(ns)' : 'Pasta'}</div>
              </div>
            </div>
            <i class="fa-solid fa-chevron-right text-[10px] text-zinc-600 pl-1"></i>
          `;
        } else {
          card.onclick = () => {
            if (isSelectionMode) {
              if (selectedItemIds.has(item.id)) selectedItemIds.delete(item.id);
              else selectedItemIds.add(item.id);
              updateBatchUI();
              renderFolder(currentFolderNode);
              return;
            }
            if (canView) {
              openPlayer(item.id, encodeURIComponent(item.name), item.subtitleId || '');
            } else {
              triggerDownload(item.id);
            }
          };

          const previewIconOrThumb = isImg 
            ? `<div class="w-7 h-7 rounded-md overflow-hidden bg-zinc-950 border border-zinc-800 flex-shrink-0">
                 <img data-img-stream="${fullStreamUrl}" data-file-id="${item.id}" alt="${item.name}" loading="lazy" decoding="async" class="cached-img-target w-full h-full object-cover">
               </div>`
            : `<div class="w-7 h-7 rounded-md bg-zinc-900 border border-zinc-800 flex items-center justify-center flex-shrink-0">
                 <i class="fa-solid ${iconClass} text-xs"></i>
               </div>`;

          const checkMarkList = isSelectionMode
            ? `<div class="w-3.5 h-3.5 rounded ${isSelected ? 'bg-zinc-100 text-zinc-950' : 'border border-zinc-600'} flex items-center justify-center text-[9px] mr-1 flex-shrink-0">
                 ${isSelected ? '<i class="fa-solid fa-check"></i>' : ''}
               </div>`
            : '';

          card.innerHTML = `
            <div class="flex items-center space-x-2.5 min-w-0 flex-1">
              ${checkMarkList}
              ${previewIconOrThumb}
              <div class="min-w-0 flex-1">
                <div class="font-medium text-xs sm:text-sm text-zinc-200 truncate leading-tight">${item.name}</div>
                <div class="flex items-center space-x-2 text-[10px] text-zinc-500 font-mono mt-0.5">
                  <span>${item.formattedSize}</span>
                  <span class="text-zinc-700">•</span>
                  <span>${item.formattedDate ? item.formattedDate.split(' ')[0] : ''}</span>
                  ${item.subtitleId ? '<span class="text-[9px] bg-zinc-800 text-zinc-300 px-1 py-0.2 rounded border border-zinc-700 font-mono">CC</span>' : ''}
                </div>
              </div>
            </div>

            <div onclick="event.stopPropagation()">
              <button 
                onclick="triggerDownload('${item.id}')"
                title="Baixar Arquivo"
                class="p-1.5 bg-zinc-850 hover:bg-zinc-800 active:bg-zinc-750 text-zinc-400 hover:text-white border border-zinc-750 rounded-md text-xs transition inline-flex items-center justify-center cursor-pointer">
                <i class="fa-solid fa-download text-[11px]"></i>
              </button>
            </div>
          `;
        }
      }

      const videoThumbTarget = card.querySelector('.video-thumb-container');
      if (videoThumbTarget) {
        videoThumbObserver.observe(videoThumbTarget);
      }

      const imgThumbTarget = card.querySelector('.cached-img-target');
      if (imgThumbTarget) {
        loadCachedImage(imgThumbTarget, imgThumbTarget.dataset.imgStream, imgThumbTarget.dataset.fileId);
      }

      return card;
    }

    function goBackFolder() {
      if (!mediaModal.classList.contains('hidden')) {
        closePlayer();
        return true;
      }
      if (pathStack.length > 1) {
        pathStack.pop();
        currentFolderNode = pathStack[pathStack.length - 1].node;
        renderBreadcrumbs();
        renderFolder(currentFolderNode);
        return true;
      }
      return false;
    }

    window.enterFolder = (folderId) => {
      const targetFolder = (currentFolderNode.children || []).find(c => c.id === folderId);
      if (targetFolder) {
        pathStack.push({ name: targetFolder.name, node: targetFolder });
        currentFolderNode = targetFolder;
        history.pushState({ folderId, depth: pathStack.length }, '', `#folder-${pathStack.length}`);
        renderBreadcrumbs();
        renderFolder(currentFolderNode);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    };

    window.addEventListener('popstate', (e) => {
      goBackFolder();
    });

    // Touch Swipe: Voltar pasta ou passar galeria
    let touchStartX = 0;
    let touchStartY = 0;

    document.addEventListener('touchstart', (e) => {
      if (e.touches && e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      if (!e.changedTouches || e.changedTouches.length === 0) return;
      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;

      const diffX = touchEndX - touchStartX;
      const diffY = Math.abs(touchEndY - touchStartY);

      if (diffY < 70) {
        if (!mediaModal.classList.contains('hidden')) {
          // Swipe dentro da galeria (Próximo / Anterior)
          if (diffX > 60) navigateGallery(-1);
          else if (diffX < -60) navigateGallery(1);
        } else {
          // Swipe da borda esquerda para voltar pasta
          if (diffX > 75 && touchStartX < 90) {
            goBackFolder();
          }
        }
      }
    }, { passive: true });

    // Navegação de Galeria (Carrossel)
    window.navigateGallery = (direction) => {
      if (!viewableItemsList.length) return;
      currentGalleryIndex += direction;
      if (currentGalleryIndex < 0) currentGalleryIndex = viewableItemsList.length - 1;
      if (currentGalleryIndex >= viewableItemsList.length) currentGalleryIndex = 0;

      const target = viewableItemsList[currentGalleryIndex];
      if (target) {
        openPlayer(target.id, encodeURIComponent(target.name), target.subtitleId || '');
      }
    };

    window.openPlayer = (id, encodedName, subtitleId) => {
      if (activePlyr) {
        activePlyr.destroy();
        activePlyr = null;
      }

      const name = decodeURIComponent(encodedName);
      modalTitle.textContent = name;
      const ext = name.split('.').pop().toLowerCase();
      currentStreamUrl = `${window.location.origin}/api/stream/${id}`;

      // Localiza índice na galeria
      const foundIdx = viewableItemsList.findIndex(it => it.id === id);
      if (foundIdx !== -1) {
        currentGalleryIndex = foundIdx;
        galleryCounter.textContent = `${currentGalleryIndex + 1} / ${viewableItemsList.length}`;
      }

      const modalDownloadBtn = document.getElementById('modalDownloadBtn');
      if (modalDownloadBtn) {
        modalDownloadBtn.onclick = (e) => {
          e.preventDefault();
          triggerDownload(id);
        };
      }

      mediaPlayerWrapper.innerHTML = '';

      if (isImage(name)) {
        mediaPlayerWrapper.innerHTML = `
          <div class="w-full h-full flex items-center justify-center p-1 bg-black overflow-hidden select-none">
            <img src="${currentStreamUrl}" alt="${name}" class="max-h-[82vh] max-w-full w-auto h-auto object-contain shadow-2xl transition-transform duration-200">
          </div>
        `;
      } else if (isPdf(name)) {
        mediaPlayerWrapper.innerHTML = `
          <div class="w-full h-[82vh] bg-slate-900 rounded-lg overflow-hidden">
            <iframe src="${currentStreamUrl}" class="w-full h-full border-0"></iframe>
          </div>
        `;
      } else if (['txt', 'log'].includes(ext)) {
        mediaPlayerWrapper.innerHTML = `<div class="p-4 text-xs text-slate-400">Carregando visualização...</div>`;
        fetch(currentStreamUrl)
          .then(r => r.text())
          .then(text => {
            mediaPlayerWrapper.innerHTML = `
              <pre class="w-full h-[80vh] overflow-auto p-4 text-xs font-mono text-slate-200 bg-slate-950 rounded-xl whitespace-pre-wrap">${text.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre>
            `;
          })
          .catch(() => {
            mediaPlayerWrapper.innerHTML = `<div class="p-4 text-xs text-rose-400">Não foi possível carregar a pré-visualização.</div>`;
          });
      } else if (isAudio(name)) {
        mediaPlayerWrapper.innerHTML = `
          <div class="p-8 w-full flex flex-col items-center justify-center">
            <i class="fa-solid fa-compact-disc fa-spin text-6xl text-brand mb-6"></i>
            <audio id="playerTarget" controls class="w-full max-w-md">
              <source src="${currentStreamUrl}" type="audio/${ext === 'mp3' ? 'mpeg' : ext}">
            </audio>
          </div>
        `;
        activePlyr = new Plyr('#playerTarget', {
          controls: ['play', 'progress', 'current-time', 'duration', 'mute', 'volume']
        });
      } else {
        // Player de Vídeo com Autoplay Imediato e Retomada de Posição
        const video = document.createElement('video');
        video.id = 'playerTarget';
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        video.preload = 'auto';
        video.className = 'w-full max-h-[82vh] object-contain';

        let tracksHtml = '';
        if (subtitleId) {
          tracksHtml = `<track kind="captions" label="Português / Legenda" src="/api/subtitles/${subtitleId}" srclang="pt" default>`;
        }

        let videoMime = 'video/mp4';
        if (ext === 'webm') videoMime = 'video/webm';
        else if (ext === 'mov') videoMime = 'video/quicktime';
        else if (ext === 'm4v') videoMime = 'video/x-m4v';
        else if (ext === 'ogv') videoMime = 'video/ogg';
        else if (ext === 'mkv') videoMime = 'video/x-matroska';

        video.innerHTML = `<source src="${currentStreamUrl}" type="${videoMime}">${tracksHtml}`;
        mediaPlayerWrapper.appendChild(video);

        const preferredSpeed = parseFloat(localStorage.getItem('clonp_preferred_speed') || '1');

        activePlyr = new Plyr('#playerTarget', {
          autoplay: true, // Força início imediato
          controls: [
            'play-large', 'play', 'progress', 'current-time', 'duration', 
            'mute', 'volume', 'captions', 'settings', 'pip', 'fullscreen'
          ],
          seekTime: 10,
          speed: { selected: preferredSpeed, options: [0.5, 0.75, 1, 1.25, 1.5, 2] }
        });

        // Lembra velocidade preferida do usuário
        activePlyr.on('ratechange', () => {
          if (activePlyr.speed) {
            localStorage.setItem('clonp_preferred_speed', activePlyr.speed);
          }
        });

        // Suporte a HLS / Streaming Adaptativo (hls.js)
        if (ext === 'm3u8' && Hls.isSupported()) {
          const hls = new Hls({ maxBufferLength: 30 });
          hls.loadSource(currentStreamUrl);
          hls.attachMedia(video);
        }

        // Duplo Toque Mobile para Avançar/Retroceder 10s (Estilo YouTube/Netflix)
        let lastTapTime = 0;
        let lastTapSide = '';
        video.parentElement.addEventListener('touchend', (e) => {
          const currentTime = new Date().getTime();
          const tapInterval = currentTime - lastTapTime;
          const touch = e.changedTouches[0];
          if (!touch) return;
          const rect = video.getBoundingClientRect();
          const tapX = touch.clientX - rect.left;
          const side = tapX > (rect.width / 2) ? 'right' : 'left';

          if (tapInterval < 320 && tapInterval > 0 && side === lastTapSide) {
            e.preventDefault();
            if (side === 'right') {
              activePlyr.forward(10);
              showToast('+10s ⏩');
            } else {
              activePlyr.rewind(10);
              showToast('⏪ -10s');
            }
          }
          lastTapTime = currentTime;
          lastTapSide = side;
        });

        // Disparo imediato de reprodução assim que tiver dados prontos
        activePlyr.on('canplay', () => {
          activePlyr.play().catch(() => {});
        });

        // Lembrar última posição assistida
        const resumeStorageKey = `clonp_resume_${id}`;
        const savedTime = localStorage.getItem(resumeStorageKey);

        activePlyr.on('loadedmetadata', () => {
          if (savedTime && parseFloat(savedTime) > 5) {
            activePlyr.currentTime = parseFloat(savedTime);
            showToast(`Retomando aos ${Math.floor(parseFloat(savedTime) / 60)}m${Math.floor(parseFloat(savedTime) % 60)}s`);
          }
          activePlyr.play().catch(() => {});
        });

        activePlyr.on('timeupdate', () => {
          if (activePlyr.currentTime > 5) {
            localStorage.setItem(resumeStorageKey, activePlyr.currentTime);
          }
        });
      }

      mediaModal.classList.remove('hidden');
    };

    function closePlayer() {
      if (activePlyr) {
        activePlyr.destroy();
        activePlyr = null;
      }
      mediaPlayerWrapper.innerHTML = '';
      mediaModal.classList.add('hidden');
    }

    closeModalBtn.addEventListener('click', closePlayer);
    mediaModal.addEventListener('click', (e) => {
      if (e.target === mediaModal) closePlayer();
    });
  </script>
</body>
</html>
