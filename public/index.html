<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1120" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <title>Clonp</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#ef4444',
            darkbg: '#0b1120',
            darkcard: '#151f32'
          }
        }
      }
    }
  </script>

  <!-- FontAwesome & Plyr CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  
  <style>
    :root {
      --plyr-color-main: #ef4444;
    }
    body {
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-tap-highlight-color: transparent;
    }
    .touch-target {
      min-height: 44px;
      min-width: 44px;
    }
    .plyr--video {
      border-radius: 0.75rem;
      overflow: hidden;
    }
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-brand selection:text-white pb-6 select-none">

  <!-- Header Mobile Otimizado -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50 px-4 py-3">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand to-rose-400 flex items-center justify-center shadow-md shadow-brand/20">
          <i class="fa-solid fa-folder-tree text-white text-base"></i>
        </div>
        <div>
          <span class="font-extrabold text-lg tracking-tight text-white">Clon<span class="text-brand">p</span></span>
        </div>
      </div>
      
      <div class="flex items-center space-x-2">
        <!-- Botão Instalar PWA se disponível -->
        <button id="pwaInstallBtn" class="hidden px-2.5 py-1 bg-brand/20 text-brand border border-brand/30 rounded-full text-xs font-semibold flex items-center space-x-1">
          <i class="fa-solid fa-download text-[10px]"></i>
          <span>Instalar App</span>
        </button>

        <div class="flex items-center space-x-1.5 bg-slate-800 px-2.5 py-1 rounded-full border border-slate-700/60 text-[11px] text-slate-300">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>Online</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto px-3.5 py-4 flex-1 w-full space-y-4">

    <!-- Card de Inserção de Link -->
    <div class="bg-darkcard border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-lg relative overflow-hidden">
      <h1 class="text-lg sm:text-xl font-bold mb-3 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-cloud-arrow-down text-brand"></i>
          <span>Colar link MEGA</span>
        </div>
        <!-- Botão Abrir Histórico -->
        <button id="toggleHistoryBtn" class="text-xs text-slate-400 hover:text-white flex items-center space-x-1 py-1 px-2 rounded-lg bg-slate-900 border border-slate-800">
          <i class="fa-solid fa-clock-rotate-left text-[11px] text-brand"></i>
          <span>Recentes</span>
        </button>
      </h1>

      <!-- Drawer de Links Recentes -->
      <div id="recentLinksContainer" class="hidden mb-3 p-3 bg-slate-950/80 rounded-xl border border-slate-800 space-y-1.5">
        <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1 flex items-center justify-between">
          <span>Últimos links visitados</span>
          <button onclick="clearHistory()" class="text-rose-400 hover:text-rose-300 text-[10px]">Limpar</button>
        </div>
        <div id="recentLinksList" class="space-y-1 text-xs">
          <!-- Injetado via JS -->
        </div>
      </div>

      <form id="inspectForm" class="flex flex-col gap-2.5">
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
            <i class="fa-solid fa-link text-xs"></i>
          </div>
          <input 
            type="url" 
            id="urlInput"
            required
            inputmode="url"
            autocomplete="off"
            placeholder="Cole o link https://mega.nz/..." 
            class="w-full pl-9 pr-3 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:border-brand focus:ring-1 focus:ring-brand focus:outline-none transition-all placeholder:text-slate-500 text-sm"
          />
        </div>
        <button 
          type="submit" 
          id="btnInspect"
          class="w-full py-3 bg-brand active:bg-rose-600 text-white font-semibold text-sm rounded-xl transition flex items-center justify-center space-x-2 shadow-md shadow-brand/25 cursor-pointer touch-target">
          <i class="fa-solid fa-folder-open"></i>
          <span>Explorar Arquivos</span>
        </button>
      </form>
      
      <!-- Erro -->
      <div id="errorBox" class="hidden mt-3 p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs flex items-start space-x-2.5">
        <i class="fa-solid fa-triangle-exclamation mt-0.5"></i>
        <div id="errorMessage"></div>
      </div>
    </div>

    <!-- Spinner de carregamento -->
    <div id="loadingBox" class="hidden flex-col items-center justify-center py-12 space-y-3">
      <div class="w-10 h-10 border-3 border-slate-700 border-t-brand rounded-full animate-spin"></div>
      <p class="text-slate-400 text-xs animate-pulse">Lendo estrutura do link...</p>
    </div>

    <!-- Resultados e Navegador -->
    <div id="resultsBox" class="hidden space-y-3">
      
      <!-- Barra Superior: Breadcrumbs -->
      <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-800 flex items-center justify-between gap-2 overflow-x-auto">
        <nav id="breadcrumbs" class="flex items-center gap-1.5 text-xs text-slate-300 font-medium whitespace-nowrap overflow-x-auto py-0.5">
          <!-- Início / Pasta ... -->
        </nav>
      </div>

      <!-- Barra de Ferramentas Mobile: Ordenação, Alternador de Visualização e Modo Seleção em Lote -->
      <div class="flex items-center justify-between gap-2">
        <!-- Lado Esquerdo: Menu Ordenar por + Botão Seleção -->
        <div class="flex items-center gap-1.5">
          <div class="relative">
            <button 
              id="sortMenuBtn"
              class="px-3 py-2 bg-slate-800 hover:bg-slate-750 border border-slate-700 rounded-xl text-xs font-medium text-slate-200 transition inline-flex items-center space-x-1.5 cursor-pointer touch-target shadow-sm">
              <i class="fa-solid fa-arrow-down-short-wide text-brand"></i>
              <span id="currentSortLabel">Nome</span>
              <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 ml-1"></i>
            </button>

            <!-- Dropdown Ordenar por -->
            <div 
              id="sortDropdown" 
              class="hidden absolute left-0 mt-2 w-52 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl z-40 py-2 divide-y divide-slate-800/80 font-sans">
              
              <div class="px-3.5 py-1.5 text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                Ordenar por
              </div>

              <div class="py-1 text-xs text-slate-200">
                <button onclick="changeSort('name')" class="w-full px-3.5 py-2.5 text-left hover:bg-slate-800 flex items-center justify-between transition cursor-pointer">
                  <span>Nome</span>
                  <i id="check_name" class="fa-solid fa-check text-brand text-xs"></i>
                </button>
                <button onclick="changeSort('date_desc')" class="w-full px-3.5 py-2.5 text-left hover:bg-slate-800 flex items-center justify-between transition cursor-pointer">
                  <span>Data de inclusão</span>
                  <i id="check_date_desc" class="fa-solid fa-check text-brand text-xs hidden"></i>
                </button>
                <button onclick="changeSort('date_asc')" class="w-full px-3.5 py-2.5 text-left hover:bg-slate-800 flex items-center justify-between transition cursor-pointer">
                  <span>Última alteração</span>
                  <i id="check_date_asc" class="fa-solid fa-check text-brand text-xs hidden"></i>
                </button>
                <button onclick="changeSort('type')" class="w-full px-3.5 py-2.5 text-left hover:bg-slate-800 flex items-center justify-between transition cursor-pointer">
                  <span>Tipo</span>
                  <i id="check_type" class="fa-solid fa-check text-brand text-xs hidden"></i>
                </button>
                <button onclick="changeSort('size')" class="w-full px-3.5 py-2.5 text-left hover:bg-slate-800 flex items-center justify-between transition cursor-pointer">
                  <span>Tamanho</span>
                  <i id="check_size" class="fa-solid fa-check text-brand text-xs hidden"></i>
                </button>
                <button onclick="changeSort('duration')" class="w-full px-3.5 py-2.5 text-left hover:bg-slate-800 flex items-center justify-between transition cursor-pointer">
                  <span>Duração / Extensão</span>
                  <i id="check_duration" class="fa-solid fa-check text-brand text-xs hidden"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Botão Ativar Seleção em Lote -->
          <button 
            id="toggleSelectModeBtn"
            onclick="toggleSelectMode()"
            class="px-2.5 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-300 hover:text-white transition touch-target flex items-center space-x-1">
            <i class="fa-solid fa-list-check text-xs text-brand"></i>
            <span class="hidden sm:inline">Selecionar</span>
          </button>
        </div>

        <!-- Lado Direito: Alternador Lista/Grade + Botão Direção -->
        <div class="flex items-center gap-1.5">
          <!-- Alternador de Visualização (Lista vs Grade) -->
          <div class="flex items-center bg-slate-900 border border-slate-800 rounded-xl p-0.5">
            <button 
              id="viewListBtn"
              onclick="setViewMode('list')" 
              title="Modo Lista"
              class="w-8 h-8 rounded-lg flex items-center justify-center text-xs transition bg-slate-800 text-brand shadow-sm">
              <i class="fa-solid fa-list"></i>
            </button>
            <button 
              id="viewGridBtn"
              onclick="setViewMode('grid')" 
              title="Modo Grade"
              class="w-8 h-8 rounded-lg flex items-center justify-center text-xs transition text-slate-400 hover:text-white">
              <i class="fa-solid fa-grip"></i>
            </button>
          </div>

          <!-- Botão Rápido de Direção: Crescente / Decrescente -->
          <button 
            id="quickDirectionBtn"
            onclick="toggleSortDirection()" 
            title="Alternar Ordem (Crescente / Decrescente)"
            class="w-9 h-9 bg-slate-900 hover:bg-slate-850 active:bg-slate-800 border border-slate-800 rounded-xl flex items-center justify-center text-slate-300 hover:text-white transition shadow-sm touch-target">
            <i id="quickDirectionIcon" class="fa-solid fa-arrow-up-a-z text-xs text-brand"></i>
          </button>
        </div>
      </div>

      <!-- Barra Flutuante de Ação em Lote (Quando itens estão selecionados) -->
      <div id="batchActionToolbar" class="hidden bg-brand/10 border border-brand/30 rounded-2xl p-2.5 flex items-center justify-between text-xs animate-fade-in">
        <div class="flex items-center space-x-2 pl-1">
          <span class="w-2 h-2 rounded-full bg-brand"></span>
          <span id="selectedCountText" class="font-bold text-slate-200">0 selecionados</span>
        </div>
        <div class="flex items-center space-x-1.5">
          <button onclick="selectAllCurrentFolder()" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-750 text-slate-300 rounded-lg">Todos</button>
          <button onclick="downloadSelectedBatch()" class="px-3 py-1.5 bg-brand hover:bg-rose-600 text-white font-semibold rounded-lg shadow flex items-center space-x-1">
            <i class="fa-solid fa-file-zipper text-xs"></i>
            <span>Baixar (.ZIP)</span>
          </button>
        </div>
      </div>

      <!-- Lista / Grade de Arquivos -->
      <div id="fileListContainer" class="space-y-2">
        <!-- Itens injetados via JS -->
      </div>

    </div>

    <!-- Modal de Visualizador Tela Cheia (Swipe Gallery & Resumo de Vídeo) -->
    <div id="mediaModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-0 bg-black/95 backdrop-blur-md">
      <div class="bg-black/90 sm:border border-slate-800 rounded-none sm:rounded-2xl max-w-5xl w-full h-full sm:h-auto sm:max-h-[92vh] p-2 sm:p-4 relative shadow-2xl flex flex-col justify-between">
        
        <!-- Barra de Topo do Modal -->
        <div class="flex items-center justify-between border-b border-slate-800/80 px-2 py-2">
          <div class="flex items-center space-x-2 truncate pr-3">
            <span class="p-1 rounded bg-brand/20 text-brand text-[10px] font-bold uppercase">Visualizador</span>
            <h3 id="modalTitle" class="font-bold text-xs sm:text-sm text-slate-100 truncate">Reproduzindo</h3>
          </div>
          <button id="closeModalBtn" class="text-slate-300 hover:text-white p-2 rounded-xl touch-target flex items-center justify-center bg-slate-800/60 active:bg-slate-700">
            <i class="fa-solid fa-xmark text-xl"></i>
          </button>
        </div>
        
        <!-- Área Central de Exibição Expandida -->
        <div id="mediaPlayerWrapper" class="w-full flex-1 bg-black flex items-center justify-center overflow-hidden my-auto min-h-[320px] relative">
          <!-- Player ou Imagem injetada via JS -->
        </div>

        <!-- Controles de Galeria (Anterior / Próximo) e Download -->
        <div class="flex items-center justify-between px-2 pt-2 text-xs border-t border-slate-800/80">
          <div class="flex items-center space-x-1">
            <button onclick="navigateGallery(-1)" class="p-2 rounded-lg bg-slate-800 text-slate-300 hover:text-white" title="Item Anterior">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <span id="galleryCounter" class="text-[11px] text-slate-400 px-2 font-mono">1 / 1</span>
            <button onclick="navigateGallery(1)" class="p-2 rounded-lg bg-slate-800 text-slate-300 hover:text-white" title="Próximo Item">
              <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>

          <a id="modalDownloadBtn" href="#" download class="text-slate-300 hover:text-white flex items-center space-x-1.5 py-1.5 px-3 rounded-lg bg-slate-800 active:bg-slate-700 text-xs">
            <i class="fa-solid fa-download text-[11px]"></i>
            <span>Baixar arquivo</span>
          </a>
        </div>
      </div>
    </div>

    <!-- Toast de Notificação -->
    <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-emerald-600 text-white px-4 py-2.5 rounded-full shadow-2xl text-xs flex items-center space-x-2 z-50 whitespace-nowrap">
      <i class="fa-solid fa-check"></i>
      <span id="toastMsg">Notificação</span>
    </div>

  </main>

  <!-- Plyr JS -->
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

  <script>
    // Registro do Service Worker (PWA)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

    let deferredPrompt = null;
    const pwaInstallBtn = document.getElementById('pwaInstallBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      pwaInstallBtn.classList.remove('hidden');
    });

    pwaInstallBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          pwaInstallBtn.classList.add('hidden');
        }
        deferredPrompt = null;
      }
    });

    const inspectForm = document.getElementById('inspectForm');
    const urlInput = document.getElementById('urlInput');
    const btnInspect = document.getElementById('btnInspect');
    const loadingBox = document.getElementById('loadingBox');
    const resultsBox = document.getElementById('resultsBox');
    const errorBox = document.getElementById('errorBox');
    const errorMessage = document.getElementById('errorMessage');
    const fileListContainer = document.getElementById('fileListContainer');
    const breadcrumbs = document.getElementById('breadcrumbs');

    const sortMenuBtn = document.getElementById('sortMenuBtn');
    const sortDropdown = document.getElementById('sortDropdown');
    const currentSortLabel = document.getElementById('currentSortLabel');

    const mediaModal = document.getElementById('mediaModal');
    const modalTitle = document.getElementById('modalTitle');
    const mediaPlayerWrapper = document.getElementById('mediaPlayerWrapper');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const galleryCounter = document.getElementById('galleryCounter');

    let rootNode = null;
    let currentFolderNode = null;
    let pathStack = []; 
    let activePlyr = null;
    let currentStreamUrl = '';

    let currentSortBy = 'name';
    let isAscending = true;
    let currentViewMode = localStorage.getItem('clonp_view_mode') || 'list';

    // Gerenciador de Seleção em Lote
    let isSelectionMode = false;
    const selectedItemIds = new Set();

    // Galeria Swipe
    let viewableItemsList = [];
    let currentGalleryIndex = 0;

    // Histórico de Links Recentes
    const toggleHistoryBtn = document.getElementById('toggleHistoryBtn');
    const recentLinksContainer = document.getElementById('recentLinksContainer');
    const recentLinksList = document.getElementById('recentLinksList');

    toggleHistoryBtn.addEventListener('click', () => {
      recentLinksContainer.classList.toggle('hidden');
      renderRecentLinks();
    });

    function saveRecentLink(url, title) {
      let recent = JSON.parse(localStorage.getItem('clonp_recent_links') || '[]');
      recent = recent.filter(r => r.url !== url);
      recent.unshift({ url, title: title || url, date: Date.now() });
      if (recent.length > 6) recent.pop();
      localStorage.setItem('clonp_recent_links', JSON.stringify(recent));
      renderRecentLinks();
    }

    function renderRecentLinks() {
      const recent = JSON.parse(localStorage.getItem('clonp_recent_links') || '[]');
      if (!recent.length) {
        recentLinksList.innerHTML = `<div class="text-slate-500 py-1">Nenhum link recente salvo.</div>`;
        return;
      }
      recentLinksList.innerHTML = '';
      recent.forEach(r => {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between py-1.5 px-2 hover:bg-slate-900 rounded-lg cursor-pointer transition';
        item.onclick = () => {
          urlInput.value = r.url;
          recentLinksContainer.classList.add('hidden');
          inspectForm.dispatchEvent(new Event('submit'));
        };
        item.innerHTML = `
          <div class="truncate flex-1 pr-2 text-slate-300 font-medium">${r.title}</div>
          <i class="fa-solid fa-arrow-right text-[10px] text-slate-600"></i>
        `;
        recentLinksList.appendChild(item);
      });
    }

    window.clearHistory = () => {
      localStorage.removeItem('clonp_recent_links');
      renderRecentLinks();
    };

    function setViewMode(mode) {
      currentViewMode = mode;
      localStorage.setItem('clonp_view_mode', mode);

      const listBtn = document.getElementById('viewListBtn');
      const gridBtn = document.getElementById('viewGridBtn');

      if (mode === 'grid') {
        gridBtn.className = 'w-8 h-8 rounded-lg flex items-center justify-center text-xs transition bg-slate-800 text-brand shadow-sm';
        listBtn.className = 'w-8 h-8 rounded-lg flex items-center justify-center text-xs transition text-slate-400 hover:text-white';
        fileListContainer.className = 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2.5';
      } else {
        listBtn.className = 'w-8 h-8 rounded-lg flex items-center justify-center text-xs transition bg-slate-800 text-brand shadow-sm';
        gridBtn.className = 'w-8 h-8 rounded-lg flex items-center justify-center text-xs transition text-slate-400 hover:text-white';
        fileListContainer.className = 'flex flex-col divide-y divide-slate-800/80 bg-darkcard border border-slate-800 rounded-2xl overflow-hidden shadow-md';
      }

      if (currentFolderNode) {
        renderFolder(currentFolderNode);
      }
    }

    const sortLabels = {
      name: 'Nome',
      date_desc: 'Data de inclusão',
      date_asc: 'Última alteração',
      type: 'Tipo',
      size: 'Tamanho',
      duration: 'Duração'
    };

    sortMenuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      sortDropdown.classList.toggle('hidden');
    });

    document.addEventListener('click', (e) => {
      if (!sortDropdown.contains(e.target) && !sortMenuBtn.contains(e.target)) {
        sortDropdown.classList.add('hidden');
      }
    });

    window.changeSort = (sortKey) => {
      currentSortBy = sortKey;
      currentSortLabel.textContent = sortLabels[sortKey];

      Object.keys(sortLabels).forEach(key => {
        const el = document.getElementById(`check_${key}`);
        if (el) {
          if (key === sortKey) el.classList.remove('hidden');
          else el.classList.add('hidden');
        }
      });

      sortDropdown.classList.add('hidden');
      if (currentFolderNode) {
        renderFolder(currentFolderNode);
      }
    };

    window.toggleSortDirection = () => {
      isAscending = !isAscending;
      const quickIcon = document.getElementById('quickDirectionIcon');
      if (quickIcon) {
        quickIcon.className = isAscending ? 'fa-solid fa-arrow-up-a-z text-xs text-brand' : 'fa-solid fa-arrow-down-z-a text-xs text-brand';
      }
      if (currentFolderNode) {
        renderFolder(currentFolderNode);
      }
    };

    function sortItems(items) {
      return [...items].sort((a, b) => {
        if (a.isDirectory && !b.isDirectory) return -1;
        if (!a.isDirectory && b.isDirectory) return 1;

        let result = 0;
        switch (currentSortBy) {
          case 'name':
            result = a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
            break;
          case 'date_desc':
            result = (b.timestamp || 0) - (a.timestamp || 0);
            break;
          case 'date_asc':
            result = (a.timestamp || 0) - (b.timestamp || 0);
            break;
          case 'type':
            result = (a.extension || '').localeCompare(b.extension || '');
            break;
          case 'size':
            result = (a.size || 0) - (b.size || 0);
            break;
          case 'duration':
            result = (a.extension || '').localeCompare(b.extension || '');
            break;
          default:
            result = a.name.localeCompare(b.name);
        }

        return isAscending ? result : -result;
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2500);
    }

    function getFileIcon(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      if (['mp4', 'mkv', 'avi', 'mov', 'webm', 'm4v', '3gp', 'flv', 'wmv', 'ts'].includes(ext)) return 'fa-file-video text-indigo-400';
      if (['mp3', 'wav', 'flac', 'aac', 'ogg', 'm4a', 'wma', 'opus'].includes(ext)) return 'fa-file-audio text-purple-400';
      if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp', 'ico', 'tiff', 'heic', 'avif'].includes(ext)) return 'fa-file-image text-emerald-400';
      if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) return 'fa-file-zipper text-amber-400';
      if (['pdf'].includes(ext)) return 'fa-file-pdf text-rose-400';
      if (['srt', 'vtt'].includes(ext)) return 'fa-closed-captioning text-yellow-400';
      return 'fa-file text-slate-400';
    }

    function isViewable(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      return isImage(filename) || isVideo(filename) || isAudio(filename) || isPdf(filename) || ['txt', 'log', 'json', 'md', 'xml'].includes(ext);
    }

    function isImage(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      return ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp', 'ico', 'tiff', 'avif', 'heic'].includes(ext);
    }

    function isVideo(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      return ['mp4', 'webm', 'mov', 'm4v', 'mkv', 'avi', '3gp', 'ogv'].includes(ext);
    }

    function isPdf(filename) {
      return filename.toLowerCase().endsWith('.pdf');
    }

    function isAudio(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      return ['mp3', 'wav', 'ogg', 'm4a', 'aac', 'flac', 'opus'].includes(ext);
    }

    // Controle de Seleção em Lote
    window.toggleSelectMode = () => {
      isSelectionMode = !isSelectionMode;
      const btn = document.getElementById('toggleSelectModeBtn');
      const toolbar = document.getElementById('batchActionToolbar');

      if (isSelectionMode) {
        btn.classList.add('bg-brand', 'text-white');
        btn.classList.remove('bg-slate-900', 'text-slate-300');
        toolbar.classList.remove('hidden');
      } else {
        btn.classList.remove('bg-brand', 'text-white');
        btn.classList.add('bg-slate-900', 'text-slate-300');
        toolbar.classList.add('hidden');
        selectedItemIds.clear();
      }
      updateBatchUI();
      renderFolder(currentFolderNode);
    };

    function updateBatchUI() {
      document.getElementById('selectedCountText').textContent = `${selectedItemIds.size} selecionado(s)`;
    }

    window.selectAllCurrentFolder = () => {
      if (!currentFolderNode || !currentFolderNode.children) return;
      currentFolderNode.children.forEach(c => {
        if (!c.isDirectory) selectedItemIds.add(c.id);
      });
      updateBatchUI();
      renderFolder(currentFolderNode);
    };

    window.downloadSelectedBatch = async () => {
      if (selectedItemIds.size === 0) {
        showToast('Nenhum arquivo selecionado.');
        return;
      }
      showToast('Preparando download do pacote...');
      const ids = Array.from(selectedItemIds);
      
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = '/api/download-batch';
      form.target = '_blank';

      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = 'payload';
      
      // Envia via fetch com blob download para manter seguro
      try {
        const res = await fetch('/api/download-batch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ids, zipName: 'selecao_clonp' })
        });
        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'selecao_clonp.zip';
        a.click();
        window.URL.revokeObjectURL(url);
      } catch (err) {
        showToast('Erro ao baixar lote.');
      }
    };

    inspectForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = urlInput.value.trim();
      if (!url) return;

      errorBox.classList.add('hidden');
      resultsBox.classList.add('hidden');
      loadingBox.classList.remove('hidden');
      btnInspect.disabled = true;

      try {
        const res = await fetch('/api/inspect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Erro ao processar o link.');
        }

        rootNode = data.tree;
        currentFolderNode = rootNode;
        pathStack = [{ name: data.name || 'Início', node: rootNode }];

        saveRecentLink(url, data.name || 'Pasta MEGA');

        setViewMode(currentViewMode);
        renderBreadcrumbs();
        renderFolder(currentFolderNode);
        resultsBox.classList.remove('hidden');
      } catch (err) {
        errorMessage.textContent = err.message;
        errorBox.classList.remove('hidden');
      } finally {
        loadingBox.classList.add('hidden');
        btnInspect.disabled = false;
      }
    });

    function renderBreadcrumbs() {
      breadcrumbs.innerHTML = '';
      pathStack.forEach((entry, index) => {
        const isLast = index === pathStack.length - 1;
        const item = document.createElement('div');
        item.className = 'flex items-center space-x-1 flex-shrink-0';

        if (index > 0) {
          const sep = document.createElement('span');
          sep.className = 'text-slate-600 text-xs px-0.5';
          sep.textContent = '/';
          item.appendChild(sep);
        }

        if (isLast) {
          const span = document.createElement('span');
          span.className = 'text-white font-bold flex items-center space-x-1 bg-slate-800 px-2 py-1 rounded-lg';
          span.innerHTML = `<i class="fa-solid fa-folder-open text-brand text-xs"></i> <span class="max-w-[120px] truncate">${entry.name}</span>`;
          item.appendChild(span);
        } else {
          const btn = document.createElement('button');
          btn.className = 'text-slate-400 hover:text-brand transition flex items-center space-x-1 cursor-pointer py-1 px-1';
          btn.innerHTML = `<span class="max-w-[90px] truncate">${entry.name}</span>`;
          btn.onclick = () => {
            pathStack = pathStack.slice(0, index + 1);
            currentFolderNode = entry.node;
            renderBreadcrumbs();
            renderFolder(currentFolderNode);
          };
          item.appendChild(btn);
        }

        breadcrumbs.appendChild(item);
      });

      breadcrumbs.scrollLeft = breadcrumbs.scrollWidth;
    }

    function renderFolder(folderNode) {
      fileListContainer.innerHTML = '';
      let children = folderNode.children || [];

      children = sortItems(children);

      // Atualiza lista de itens visualizáveis para a galeria swipe
      viewableItemsList = children.filter(c => !c.isDirectory && isViewable(c.name));

      // Botão "Voltar"
      if (pathStack.length > 1) {
        const backCard = document.createElement('div');
        if (currentViewMode === 'grid') {
          backCard.className = 'col-span-full bg-slate-900/60 hover:bg-slate-800/80 border border-slate-800/80 rounded-xl p-2.5 flex items-center space-x-2.5 cursor-pointer text-slate-300 active:scale-[0.99] transition touch-target';
          backCard.innerHTML = `
            <div class="w-7 h-7 rounded-lg bg-slate-800 flex items-center justify-center text-brand">
              <i class="fa-solid fa-arrow-turn-up text-xs"></i>
            </div>
            <span class="font-bold text-xs text-slate-200">.. Voltar pasta</span>
          `;
        } else {
          backCard.className = 'p-3 flex items-center space-x-3 cursor-pointer text-slate-300 hover:bg-slate-800/40 active:scale-[0.99] transition touch-target border-b border-slate-800/80';
          backCard.innerHTML = `
            <div class="w-7 h-7 rounded-lg bg-slate-800 flex items-center justify-center text-brand">
              <i class="fa-solid fa-arrow-turn-up text-xs"></i>
            </div>
            <span class="font-bold text-xs text-slate-200">.. Voltar pasta</span>
          `;
        }
        backCard.onclick = () => {
          pathStack.pop();
          currentFolderNode = pathStack[pathStack.length - 1].node;
          renderBreadcrumbs();
          renderFolder(currentFolderNode);
        };
        fileListContainer.appendChild(backCard);
      }

      if (!children.length) {
        const empty = document.createElement('div');
        empty.className = 'col-span-full py-10 text-center text-slate-500 text-xs bg-slate-900/30 rounded-xl border border-dashed border-slate-800';
        empty.textContent = 'Esta pasta está vazia.';
        fileListContainer.appendChild(empty);
        return;
      }

      children.forEach(item => {
        const card = document.createElement('div');
        const iconClass = getFileIcon(item.name);
        const canView = isViewable(item.name);
        const isImg = isImage(item.name);
        const isVid = isVideo(item.name);
        const fullStreamUrl = `${window.location.origin}/api/stream/${item.id}`;
        const isSelected = selectedItemIds.has(item.id);

        if (currentViewMode === 'grid') {
          // ================= MODO GRADE =================
          card.className = `bg-darkcard border ${isSelected ? 'border-brand ring-1 ring-brand' : 'border-slate-800/80'} rounded-2xl p-2.5 flex flex-col justify-between transition hover:border-slate-700 active:scale-[0.98] select-none cursor-pointer group shadow-sm relative`;

          if (item.isDirectory) {
            card.onclick = () => enterFolder(item.id);
            card.innerHTML = `
              <div class="flex flex-col items-center text-center py-2 flex-1 justify-center">
                <div class="w-14 h-14 rounded-2xl bg-brand/10 border border-brand/20 flex items-center justify-center text-brand mb-2 group-hover:scale-105 transition">
                  <i class="fa-solid fa-folder text-3xl"></i>
                </div>
                <div class="font-semibold text-xs text-slate-100 line-clamp-2 w-full break-words" title="${item.name}">${item.name}</div>
                <div class="text-[10px] text-slate-500 mt-1">${item.children ? item.children.length + ' item(ns)' : 'Pasta'}</div>
              </div>
            `;
          } else {
            card.onclick = () => {
              if (isSelectionMode) {
                if (selectedItemIds.has(item.id)) selectedItemIds.delete(item.id);
                else selectedItemIds.add(item.id);
                updateBatchUI();
                renderFolder(currentFolderNode);
                return;
              }
              if (canView) {
                openPlayer(item.id, encodeURIComponent(item.name), item.subtitleId || '');
              } else {
                window.location.href = `/api/stream/${item.id}?download=1`;
              }
            };

            let thumbnailHtml = '';
            if (isImg) {
              thumbnailHtml = `
                <div class="w-full h-28 rounded-xl overflow-hidden bg-slate-950 border border-slate-800/80 flex items-center justify-center mb-2 relative group-hover:border-slate-700 transition">
                  <img src="${fullStreamUrl}" alt="${item.name}" loading="lazy" decoding="async" class="w-full h-full object-cover transition-opacity duration-300 opacity-0" onload="this.classList.remove('opacity-0')">
                  <div class="absolute bottom-1.5 right-1.5 bg-black/60 backdrop-blur-sm p-1 rounded-md text-[9px] text-emerald-400 leading-none">
                    <i class="fa-solid fa-image"></i>
                  </div>
                </div>`;
            } else if (isVid) {
              thumbnailHtml = `
                <div class="w-full h-28 rounded-xl overflow-hidden bg-gradient-to-tr from-slate-950 via-slate-900 to-indigo-950/40 border border-slate-800/80 flex items-center justify-center mb-2 relative group-hover:border-slate-700 transition">
                  <div class="w-10 h-10 rounded-full bg-brand/90 text-white flex items-center justify-center shadow-lg group-hover:scale-110 transition">
                    <i class="fa-solid fa-play text-xs ml-0.5"></i>
                  </div>
                  <div class="absolute bottom-1.5 right-1.5 bg-black/60 backdrop-blur-sm p-1 rounded-md text-[9px] text-indigo-400 leading-none">
                    <i class="fa-solid fa-video"></i>
                  </div>
                </div>`;
            } else if (isPdf(item.name)) {
              thumbnailHtml = `
                <div class="w-full h-28 rounded-xl bg-gradient-to-b from-rose-950/20 to-slate-950 border border-slate-800/80 flex flex-col items-center justify-center mb-2 relative group-hover:border-slate-700 transition">
                  <i class="fa-solid fa-file-pdf text-3xl text-rose-500 mb-1"></i>
                  <span class="text-[9px] text-rose-400 font-semibold uppercase tracking-wider">PDF</span>
                </div>`;
            } else {
              thumbnailHtml = `
                <div class="w-full h-28 rounded-xl bg-slate-950 border border-slate-800/80 flex flex-col items-center justify-center mb-2 relative group-hover:border-slate-700 transition">
                  <i class="fa-solid ${iconClass} text-2xl mb-1"></i>
                  <span class="text-[9px] text-slate-500 uppercase font-mono">${item.extension || 'FILE'}</span>
                </div>`;
            }

            // Checkbox de seleção se ativo
            const checkMark = isSelectionMode 
              ? `<div class="absolute top-2 left-2 w-5 h-5 rounded-md ${isSelected ? 'bg-brand text-white' : 'bg-black/50 text-transparent border border-white/40'} flex items-center justify-center text-xs">
                   <i class="fa-solid fa-check"></i>
                 </div>`
              : '';

            card.innerHTML = `
              ${checkMark}
              <div class="flex flex-col items-center text-center py-0.5 flex-1 justify-center min-w-0">
                ${thumbnailHtml}
                <div class="font-medium text-[11px] text-slate-200 line-clamp-2 w-full break-words leading-tight" title="${item.name}">${item.name}</div>
                <div class="text-[10px] text-slate-400 font-mono mt-1">${item.formattedSize}</div>
              </div>

              <div class="flex items-center pt-2 border-t border-slate-800/60 mt-1 justify-center" onclick="event.stopPropagation()">
                <a 
                  href="/api/stream/${item.id}?download=1" 
                  download 
                  title="Baixar"
                  class="w-full py-1.5 bg-slate-800 active:bg-slate-750 text-slate-300 hover:text-white border border-slate-700/70 rounded-lg text-[11px] font-medium transition flex items-center justify-center space-x-1">
                  <i class="fa-solid fa-download text-[10px]"></i>
                  <span>Baixar</span>
                </a>
              </div>
            `;
          }

        } else {
          // ================= MODO LISTA COMPACTA =================
          card.className = `p-3 flex items-center justify-between gap-3 hover:bg-slate-800/40 ${isSelected ? 'bg-brand/10' : ''} active:bg-slate-800/70 transition cursor-pointer select-none`;

          if (item.isDirectory) {
            card.onclick = () => enterFolder(item.id);
            card.innerHTML = `
              <div class="flex items-center space-x-3 min-w-0 flex-1">
                <div class="w-8 h-8 rounded-lg bg-brand/10 text-brand flex items-center justify-center flex-shrink-0">
                  <i class="fa-solid fa-folder text-base"></i>
                </div>
                <div class="min-w-0 flex-1">
                  <div class="font-medium text-xs sm:text-sm text-slate-100 truncate">${item.name}</div>
                  <div class="text-[10px] text-slate-500">${item.children ? item.children.length + ' item(ns)' : 'Pasta'}</div>
                </div>
              </div>
              <i class="fa-solid fa-chevron-right text-xs text-slate-600 pl-2"></i>
            `;
          } else {
            card.onclick = () => {
              if (isSelectionMode) {
                if (selectedItemIds.has(item.id)) selectedItemIds.delete(item.id);
                else selectedItemIds.add(item.id);
                updateBatchUI();
                renderFolder(currentFolderNode);
                return;
              }
              if (canView) {
                openPlayer(item.id, encodeURIComponent(item.name), item.subtitleId || '');
              } else {
                window.location.href = `/api/stream/${item.id}?download=1`;
              }
            };

            const previewIconOrThumb = isImg 
              ? `<div class="w-8 h-8 rounded-lg overflow-hidden bg-slate-900 border border-slate-800 flex-shrink-0">
                   <img src="${fullStreamUrl}" alt="${item.name}" loading="lazy" decoding="async" class="w-full h-full object-cover">
                 </div>`
              : `<div class="w-8 h-8 rounded-lg bg-slate-900 border border-slate-800 flex items-center justify-center flex-shrink-0">
                   <i class="fa-solid ${iconClass} text-xs"></i>
                 </div>`;

            const checkMarkList = isSelectionMode
              ? `<div class="w-4 h-4 rounded ${isSelected ? 'bg-brand text-white' : 'border border-slate-600'} flex items-center justify-center text-[10px] mr-1 flex-shrink-0">
                   ${isSelected ? '<i class="fa-solid fa-check"></i>' : ''}
                 </div>`
              : '';

            card.innerHTML = `
              <div class="flex items-center space-x-2.5 min-w-0 flex-1">
                ${checkMarkList}
                ${previewIconOrThumb}
                <div class="min-w-0 flex-1">
                  <div class="font-medium text-xs sm:text-sm text-slate-200 truncate leading-tight">${item.name}</div>
                  <div class="flex items-center space-x-2 text-[10px] text-slate-400 font-mono mt-0.5">
                    <span>${item.formattedSize}</span>
                    <span class="text-slate-600">•</span>
                    <span>${item.formattedDate ? item.formattedDate.split(' ')[0] : ''}</span>
                    ${item.subtitleId ? '<span class="text-[9px] bg-yellow-500/20 text-yellow-400 px-1 py-0.5 rounded font-sans">Legenda</span>' : ''}
                  </div>
                </div>
              </div>

              <div onclick="event.stopPropagation()">
                <a 
                  href="/api/stream/${item.id}?download=1" 
                  download 
                  class="p-2 bg-slate-800/80 active:bg-slate-750 text-slate-400 hover:text-white rounded-lg text-xs font-medium transition inline-flex items-center justify-center">
                  <i class="fa-solid fa-download text-xs"></i>
                </a>
              </div>
            `;
          }
        }

        fileListContainer.appendChild(card);
      });
    }

    function goBackFolder() {
      if (!mediaModal.classList.contains('hidden')) {
        closePlayer();
        return true;
      }
      if (pathStack.length > 1) {
        pathStack.pop();
        currentFolderNode = pathStack[pathStack.length - 1].node;
        renderBreadcrumbs();
        renderFolder(currentFolderNode);
        return true;
      }
      return false;
    }

    window.enterFolder = (folderId) => {
      const targetFolder = (currentFolderNode.children || []).find(c => c.id === folderId);
      if (targetFolder) {
        pathStack.push({ name: targetFolder.name, node: targetFolder });
        currentFolderNode = targetFolder;
        history.pushState({ folderId, depth: pathStack.length }, '', `#folder-${pathStack.length}`);
        renderBreadcrumbs();
        renderFolder(currentFolderNode);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    };

    window.addEventListener('popstate', (e) => {
      goBackFolder();
    });

    // Touch Swipe: Voltar pasta ou passar galeria
    let touchStartX = 0;
    let touchStartY = 0;

    document.addEventListener('touchstart', (e) => {
      if (e.touches && e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      if (!e.changedTouches || e.changedTouches.length === 0) return;
      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;

      const diffX = touchEndX - touchStartX;
      const diffY = Math.abs(touchEndY - touchStartY);

      if (diffY < 70) {
        if (!mediaModal.classList.contains('hidden')) {
          // Swipe dentro da galeria (Próximo / Anterior)
          if (diffX > 60) navigateGallery(-1);
          else if (diffX < -60) navigateGallery(1);
        } else {
          // Swipe da borda esquerda para voltar pasta
          if (diffX > 75 && touchStartX < 90) {
            goBackFolder();
          }
        }
      }
    }, { passive: true });

    // Navegação de Galeria (Carrossel)
    window.navigateGallery = (direction) => {
      if (!viewableItemsList.length) return;
      currentGalleryIndex += direction;
      if (currentGalleryIndex < 0) currentGalleryIndex = viewableItemsList.length - 1;
      if (currentGalleryIndex >= viewableItemsList.length) currentGalleryIndex = 0;

      const target = viewableItemsList[currentGalleryIndex];
      if (target) {
        openPlayer(target.id, encodeURIComponent(target.name), target.subtitleId || '');
      }
    };

    window.openPlayer = (id, encodedName, subtitleId) => {
      if (activePlyr) {
        activePlyr.destroy();
        activePlyr = null;
      }

      const name = decodeURIComponent(encodedName);
      modalTitle.textContent = name;
      const ext = name.split('.').pop().toLowerCase();
      currentStreamUrl = `${window.location.origin}/api/stream/${id}`;

      // Localiza índice na galeria
      const foundIdx = viewableItemsList.findIndex(it => it.id === id);
      if (foundIdx !== -1) {
        currentGalleryIndex = foundIdx;
        galleryCounter.textContent = `${currentGalleryIndex + 1} / ${viewableItemsList.length}`;
      }

      const modalDownloadBtn = document.getElementById('modalDownloadBtn');
      if (modalDownloadBtn) {
        modalDownloadBtn.href = `${currentStreamUrl}?download=1`;
      }

      mediaPlayerWrapper.innerHTML = '';

      if (isImage(name)) {
        mediaPlayerWrapper.innerHTML = `
          <div class="w-full h-full flex items-center justify-center p-1 bg-black overflow-hidden select-none">
            <img src="${currentStreamUrl}" alt="${name}" class="max-h-[82vh] max-w-full w-auto h-auto object-contain shadow-2xl transition-transform duration-200">
          </div>
        `;
      } else if (isPdf(name)) {
        mediaPlayerWrapper.innerHTML = `
          <div class="w-full h-[82vh] bg-slate-900 rounded-lg overflow-hidden">
            <iframe src="${currentStreamUrl}" class="w-full h-full border-0"></iframe>
          </div>
        `;
      } else if (['txt', 'log'].includes(ext)) {
        mediaPlayerWrapper.innerHTML = `<div class="p-4 text-xs text-slate-400">Carregando visualização...</div>`;
        fetch(currentStreamUrl)
          .then(r => r.text())
          .then(text => {
            mediaPlayerWrapper.innerHTML = `
              <pre class="w-full h-[80vh] overflow-auto p-4 text-xs font-mono text-slate-200 bg-slate-950 rounded-xl whitespace-pre-wrap">${text.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre>
            `;
          })
          .catch(() => {
            mediaPlayerWrapper.innerHTML = `<div class="p-4 text-xs text-rose-400">Não foi possível carregar a pré-visualização.</div>`;
          });
      } else if (isAudio(name)) {
        mediaPlayerWrapper.innerHTML = `
          <div class="p-8 w-full flex flex-col items-center justify-center">
            <i class="fa-solid fa-compact-disc fa-spin text-6xl text-brand mb-6"></i>
            <audio id="playerTarget" controls class="w-full max-w-md">
              <source src="${currentStreamUrl}" type="audio/${ext === 'mp3' ? 'mpeg' : ext}">
            </audio>
          </div>
        `;
        activePlyr = new Plyr('#playerTarget', {
          controls: ['play', 'progress', 'current-time', 'duration', 'mute', 'volume']
        });
      } else {
        // Player de Vídeo Otimizado com Preload Agressivo e Retomada de Posição
        const video = document.createElement('video');
        video.id = 'playerTarget';
        video.controls = true;
        video.playsInline = true;
        video.preload = 'auto'; // Força o navegador a puxar o buffer inicial imediatamente
        video.className = 'w-full max-h-[82vh] object-contain';

        let tracksHtml = '';
        if (subtitleId) {
          tracksHtml = `<track kind="captions" label="Português / Legenda" src="/api/subtitles/${subtitleId}" srclang="pt" default>`;
        }

        let videoMime = 'video/mp4';
        if (ext === 'webm') videoMime = 'video/webm';
        else if (ext === 'mov') videoMime = 'video/quicktime';
        else if (ext === 'm4v') videoMime = 'video/x-m4v';
        else if (ext === 'ogv') videoMime = 'video/ogg';
        else if (ext === 'mkv') videoMime = 'video/x-matroska';

        video.innerHTML = `<source src="${currentStreamUrl}" type="${videoMime}">${tracksHtml}`;
        mediaPlayerWrapper.appendChild(video);

        activePlyr = new Plyr('#playerTarget', {
          controls: [
            'play-large', 'play', 'progress', 'current-time', 'duration', 
            'mute', 'volume', 'captions', 'settings', 'pip', 'fullscreen'
          ],
          speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] }
        });

        // Lembrar última posição assistida
        const resumeStorageKey = `clonp_resume_${id}`;
        const savedTime = localStorage.getItem(resumeStorageKey);

        activePlyr.on('loadedmetadata', () => {
          if (savedTime && parseFloat(savedTime) > 5) {
            activePlyr.currentTime = parseFloat(savedTime);
            showToast(`Retomando aos ${Math.floor(parseFloat(savedTime) / 60)}m${Math.floor(parseFloat(savedTime) % 60)}s`);
          }
        });

        activePlyr.on('timeupdate', () => {
          if (activePlyr.currentTime > 5) {
            localStorage.setItem(resumeStorageKey, activePlyr.currentTime);
          }
        });
      }

      mediaModal.classList.remove('hidden');
    };

    function closePlayer() {
      if (activePlyr) {
        activePlyr.destroy();
        activePlyr = null;
      }
      mediaPlayerWrapper.innerHTML = '';
      mediaModal.classList.add('hidden');
    }

    closeModalBtn.addEventListener('click', closePlayer);
    mediaModal.addEventListener('click', (e) => {
      if (e.target === mediaModal) closePlayer();
    });
  </script>
</body>
</html>
