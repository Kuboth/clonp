<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1120" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Clonp - Mobile</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#ef4444',
            darkbg: '#0b1120',
            darkcard: '#151f32'
          }
        }
      }
    }
  </script>

  <!-- FontAwesome & Plyr CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  
  <style>
    :root {
      --plyr-color-main: #ef4444;
    }
    /* Suporte a touch e safe area no iPhone */
    body {
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-tap-highlight-color: transparent;
    }
    .touch-target {
      min-height: 44px;
      min-width: 44px;
    }
    .plyr--video {
      border-radius: 0.75rem;
      overflow: hidden;
    }
    /* Estilização suave da barra de rolagem */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-brand selection:text-white pb-6">

  <!-- Header Mobile Otimizado -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50 px-4 py-3">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand to-rose-400 flex items-center justify-center shadow-md shadow-brand/20">
          <i class="fa-solid fa-folder-tree text-white text-base"></i>
        </div>
        <div>
          <span class="font-extrabold text-lg tracking-tight text-white">Clon<span class="text-brand">p</span></span>
        </div>
      </div>
      <div class="flex items-center space-x-1.5 bg-slate-800 px-2.5 py-1 rounded-full border border-slate-700/60 text-[11px] text-slate-300">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>Online</span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto px-3.5 py-4 flex-1 w-full space-y-4">

    <!-- Card de Inserção de Link -->
    <div class="bg-darkcard border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-lg relative overflow-hidden">
      <h1 class="text-lg sm:text-xl font-bold mb-3 flex items-center space-x-2">
        <i class="fa-solid fa-cloud-arrow-down text-brand"></i>
        <span>Colar link MEGA</span>
      </h1>

      <form id="inspectForm" class="flex flex-col gap-2.5">
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
            <i class="fa-solid fa-link text-xs"></i>
          </div>
          <input 
            type="url" 
            id="urlInput"
            required
            inputmode="url"
            autocomplete="off"
            placeholder="Cole o link https://mega.nz/..." 
            class="w-full pl-9 pr-3 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:border-brand focus:ring-1 focus:ring-brand focus:outline-none transition-all placeholder:text-slate-500 text-sm"
          />
        </div>
        <button 
          type="submit" 
          id="btnInspect"
          class="w-full py-3 bg-brand active:bg-rose-600 text-white font-semibold text-sm rounded-xl transition flex items-center justify-center space-x-2 shadow-md shadow-brand/25 cursor-pointer touch-target">
          <i class="fa-solid fa-folder-open"></i>
          <span>Explorar Arquivos</span>
        </button>
      </form>
      
      <!-- Erro -->
      <div id="errorBox" class="hidden mt-3 p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs flex items-start space-x-2.5">
        <i class="fa-solid fa-triangle-exclamation mt-0.5"></i>
        <div id="errorMessage"></div>
      </div>
    </div>

    <!-- Spinner de carregamento -->
    <div id="loadingBox" class="hidden flex-col items-center justify-center py-12 space-y-3">
      <div class="w-10 h-10 border-3 border-slate-700 border-t-brand rounded-full animate-spin"></div>
      <p class="text-slate-400 text-xs animate-pulse">Lendo estrutura do link...</p>
    </div>

    <!-- Resultados e Navegador -->
    <div id="resultsBox" class="hidden space-y-3">
      
      <!-- Barra Superior: Breadcrumbs -->
      <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-800 flex items-center justify-between gap-2 overflow-x-auto">
        <nav id="breadcrumbs" class="flex items-center gap-1.5 text-xs text-slate-300 font-medium whitespace-nowrap overflow-x-auto py-0.5">
          <!-- Início / Pasta ... -->
        </nav>
      </div>

      <!-- Barra de Ferramentas Mobile: Ordenação, Alternador de Visualização e Ações -->
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-1.5">
          <!-- Botão Ordenar por -->
          <div class="relative">
            <button 
              id="sortMenuBtn"
              class="px-3 py-2 bg-slate-800 hover:bg-slate-750 border border-slate-700 rounded-xl text-xs font-medium text-slate-200 transition inline-flex items-center space-x-1.5 cursor-pointer touch-target shadow-sm">
              <i class="fa-solid fa-arrow-down-short-wide text-brand"></i>
              <span id="currentSortLabel">Nome</span>
              <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 ml-1"></i>
            </button>

            <!-- Dropdown Ordenar por -->
            <div 
              id="sortDropdown" 
              class="hidden absolute left-0 mt-2 w-52 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl z-40 py-2 divide-y divide-slate-800/80 font-sans">
              
              <div class="px-3.5 py-1.5 text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                Ordenar por
              </div>

              <div class="py-1 text-xs text-slate-200">
                <button onclick="changeSort('name')" class="w-full px-3.5 py-2.5 text-left hover:bg-slate-800 flex items-center justify-between transition cursor-pointer">
                  <span>Nome</span>
                  <i id="check_name" class="fa-solid fa-check text-brand text-xs"></i>
                </button>
                <button onclick="changeSort('date_desc')" class="w-full px-3.5 py-2.5 text-left hover:bg-slate-800 flex items-center justify-between transition cursor-pointer">
                  <span>Data de inclusão</span>
                  <i id="check_date_desc" class="fa-solid fa-check text-brand text-xs hidden"></i>
                </button>
                <button onclick="changeSort('date_asc')" class="w-full px-3.5 py-2.5 text-left hover:bg-slate-800 flex items-center justify-between transition cursor-pointer">
                  <span>Última alteração</span>
                  <i id="check_date_asc" class="fa-solid fa-check text-brand text-xs hidden"></i>
                </button>
                <button onclick="changeSort('type')" class="w-full px-3.5 py-2.5 text-left hover:bg-slate-800 flex items-center justify-between transition cursor-pointer">
                  <span>Tipo</span>
                  <i id="check_type" class="fa-solid fa-check text-brand text-xs hidden"></i>
                </button>
                <button onclick="changeSort('size')" class="w-full px-3.5 py-2.5 text-left hover:bg-slate-800 flex items-center justify-between transition cursor-pointer">
                  <span>Tamanho</span>
                  <i id="check_size" class="fa-solid fa-check text-brand text-xs hidden"></i>
                </button>
                <button onclick="changeSort('duration')" class="w-full px-3.5 py-2.5 text-left hover:bg-slate-800 flex items-center justify-between transition cursor-pointer">
                  <span>Duração / Extensão</span>
                  <i id="check_duration" class="fa-solid fa-check text-brand text-xs hidden"></i>
                </button>
              </div>

              <div class="pt-2 px-3.5 pb-1">
                <button 
                  id="toggleDirectionBtn"
                  onclick="toggleSortDirection()" 
                  class="w-full py-1.5 text-xs text-slate-400 hover:text-white flex items-center justify-between transition">
                  <span id="directionLabel">Ordem: Crescente</span>
                  <i id="directionIcon" class="fa-solid fa-arrow-up-a-z text-brand"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Alternador de Visualização (Lista vs Grade) -->
          <div class="flex items-center bg-slate-900 border border-slate-800 rounded-xl p-0.5">
            <button 
              id="viewListBtn"
              onclick="setViewMode('list')" 
              title="Modo Lista"
              class="w-8 h-8 rounded-lg flex items-center justify-center text-xs transition bg-slate-800 text-brand shadow-sm">
              <i class="fa-solid fa-list"></i>
            </button>
            <button 
              id="viewGridBtn"
              onclick="setViewMode('grid')" 
              title="Modo Grade"
              class="w-8 h-8 rounded-lg flex items-center justify-center text-xs transition text-slate-400 hover:text-white">
              <i class="fa-solid fa-grip"></i>
            </button>
          </div>
        </div>

        <!-- Botão Baixar Tudo -->
        <a 
          id="btnDownloadAll"
          href="#" 
          class="hidden px-3 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-semibold transition items-center space-x-1 whitespace-nowrap shadow-sm touch-target">
          <i class="fa-solid fa-file-zipper"></i>
          <span class="hidden sm:inline">Baixar (.ZIP)</span>
        </a>
      </div>

      <!-- Lista Mobile Card-Based de Arquivos -->
      <div id="fileListContainer" class="space-y-2">
        <!-- Itens injetados via JS -->
      </div>

    </div>

    <!-- Modal de Player de Mídia Avançado (Plyr) -->
    <div id="mediaModal" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/90 backdrop-blur-md">
      <div class="bg-darkcard border-t sm:border border-slate-800 rounded-t-3xl sm:rounded-2xl max-w-3xl w-full p-4 relative shadow-2xl flex flex-col space-y-3 max-h-[92vh]">
        <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
          <div class="flex items-center space-x-2 truncate pr-3">
            <span class="p-1 rounded bg-brand/20 text-brand text-[10px] font-bold uppercase">Player</span>
            <h3 id="modalTitle" class="font-bold text-xs sm:text-sm text-slate-200 truncate">Reproduzindo</h3>
          </div>
          <button id="closeModalBtn" class="text-slate-400 hover:text-white p-2 rounded-xl touch-target flex items-center justify-center">
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>
        
        <div id="mediaPlayerWrapper" class="w-full bg-black rounded-xl overflow-hidden flex items-center justify-center min-h-[240px]">
          <!-- Player injetado via JS -->
        </div>

        <div class="flex items-center justify-between pt-1 text-xs">
          <span class="text-slate-400 text-[11px]">Stream Contínuo HTTP</span>
          <button id="modalVlcBtn" class="text-orange-400 active:text-orange-300 flex items-center space-x-1.5 py-1 px-2.5 rounded-lg bg-slate-800/60 border border-slate-700/50">
            <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
            <span>Copiar Link VLC</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Toast de Notificação -->
    <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-emerald-600 text-white px-4 py-2.5 rounded-full shadow-2xl text-xs flex items-center space-x-2 z-50 whitespace-nowrap">
      <i class="fa-solid fa-check"></i>
      <span id="toastMsg">Link copiado!</span>
    </div>

  </main>

  <!-- Plyr JS -->
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

  <script>
    const inspectForm = document.getElementById('inspectForm');
    const urlInput = document.getElementById('urlInput');
    const btnInspect = document.getElementById('btnInspect');
    const loadingBox = document.getElementById('loadingBox');
    const resultsBox = document.getElementById('resultsBox');
    const errorBox = document.getElementById('errorBox');
    const errorMessage = document.getElementById('errorMessage');
    const fileListContainer = document.getElementById('fileListContainer');
    const breadcrumbs = document.getElementById('breadcrumbs');
    const btnDownloadAll = document.getElementById('btnDownloadAll');

    // Elementos de Ordenação
    const sortMenuBtn = document.getElementById('sortMenuBtn');
    const sortDropdown = document.getElementById('sortDropdown');
    const currentSortLabel = document.getElementById('currentSortLabel');
    const directionLabel = document.getElementById('directionLabel');
    const directionIcon = document.getElementById('directionIcon');

    const mediaModal = document.getElementById('mediaModal');
    const modalTitle = document.getElementById('modalTitle');
    const mediaPlayerWrapper = document.getElementById('mediaPlayerWrapper');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modalVlcBtn = document.getElementById('modalVlcBtn');

    let rootNode = null;
    let currentFolderNode = null;
    let pathStack = []; 
    let activePlyr = null;
    let currentStreamUrl = '';

    let currentSortBy = 'name';
    let isAscending = true;
    let currentViewMode = localStorage.getItem('clonp_view_mode') || 'list'; // 'list' ou 'grid'

    function setViewMode(mode) {
      currentViewMode = mode;
      localStorage.setItem('clonp_view_mode', mode);

      const listBtn = document.getElementById('viewListBtn');
      const gridBtn = document.getElementById('viewGridBtn');

      if (mode === 'grid') {
        gridBtn.className = 'w-8 h-8 rounded-lg flex items-center justify-center text-xs transition bg-slate-800 text-brand shadow-sm';
        listBtn.className = 'w-8 h-8 rounded-lg flex items-center justify-center text-xs transition text-slate-400 hover:text-white';
        fileListContainer.className = 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2.5';
      } else {
        listBtn.className = 'w-8 h-8 rounded-lg flex items-center justify-center text-xs transition bg-slate-800 text-brand shadow-sm';
        gridBtn.className = 'w-8 h-8 rounded-lg flex items-center justify-center text-xs transition text-slate-400 hover:text-white';
        fileListContainer.className = 'space-y-2';
      }

      if (currentFolderNode) {
        renderFolder(currentFolderNode);
      }
    }

    const sortLabels = {
      name: 'Nome',
      date_desc: 'Data de inclusão',
      date_asc: 'Última alteração',
      type: 'Tipo',
      size: 'Tamanho',
      duration: 'Duração'
    };

    sortMenuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      sortDropdown.classList.toggle('hidden');
    });

    document.addEventListener('click', (e) => {
      if (!sortDropdown.contains(e.target) && !sortMenuBtn.contains(e.target)) {
        sortDropdown.classList.add('hidden');
      }
    });

    window.changeSort = (sortKey) => {
      currentSortBy = sortKey;
      currentSortLabel.textContent = sortLabels[sortKey];

      Object.keys(sortLabels).forEach(key => {
        const el = document.getElementById(`check_${key}`);
        if (el) {
          if (key === sortKey) el.classList.remove('hidden');
          else el.classList.add('hidden');
        }
      });

      sortDropdown.classList.add('hidden');
      if (currentFolderNode) {
        renderFolder(currentFolderNode, filterInput.value.trim());
      }
    };

    window.toggleSortDirection = () => {
      isAscending = !isAscending;
      directionLabel.textContent = isAscending ? 'Ordem: Crescente' : 'Ordem: Decrescente';
      directionIcon.className = isAscending ? 'fa-solid fa-arrow-up-a-z text-brand' : 'fa-solid fa-arrow-down-z-a text-brand';
      if (currentFolderNode) {
        renderFolder(currentFolderNode, filterInput.value.trim());
      }
    };

    function sortItems(items) {
      return [...items].sort((a, b) => {
        if (a.isDirectory && !b.isDirectory) return -1;
        if (!a.isDirectory && b.isDirectory) return 1;

        let result = 0;
        switch (currentSortBy) {
          case 'name':
            result = a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
            break;
          case 'date_desc':
            result = (b.timestamp || 0) - (a.timestamp || 0);
            break;
          case 'date_asc':
            result = (a.timestamp || 0) - (b.timestamp || 0);
            break;
          case 'type':
            result = (a.extension || '').localeCompare(b.extension || '');
            break;
          case 'size':
            result = (a.size || 0) - (b.size || 0);
            break;
          case 'duration':
            result = (a.extension || '').localeCompare(b.extension || '');
            break;
          default:
            result = a.name.localeCompare(b.name);
        }

        return isAscending ? result : -result;
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2500);
    }

    function getFileIcon(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      if (['mp4', 'mkv', 'avi', 'mov', 'webm'].includes(ext)) return 'fa-file-video text-indigo-400';
      if (['mp3', 'wav', 'flac', 'aac', 'ogg'].includes(ext)) return 'fa-file-audio text-purple-400';
      if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) return 'fa-file-image text-emerald-400';
      if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) return 'fa-file-zipper text-amber-400';
      if (['pdf'].includes(ext)) return 'fa-file-pdf text-rose-400';
      if (['srt', 'vtt'].includes(ext)) return 'fa-closed-captioning text-yellow-400';
      return 'fa-file text-slate-400';
    }

    function isMedia(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      return ['mp4', 'webm', 'mp3', 'wav', 'ogg'].includes(ext);
    }

    inspectForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = urlInput.value.trim();
      if (!url) return;

      errorBox.classList.add('hidden');
      resultsBox.classList.add('hidden');
      btnDownloadAll.classList.add('hidden');
      loadingBox.classList.remove('hidden');
      btnInspect.disabled = true;

      try {
        const res = await fetch('/api/inspect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Erro ao processar o link.');
        }

        rootNode = data.tree;
        currentFolderNode = rootNode;
        pathStack = [{ name: data.name || 'Início', node: rootNode }];

        if (data.type === 'folder' && data.folderKey) {
          btnDownloadAll.href = `/api/download-folder/${data.folderKey}`;
          btnDownloadAll.classList.remove('hidden');
          btnDownloadAll.classList.add('inline-flex');
        }

        renderBreadcrumbs();
        renderFolder(currentFolderNode);
        resultsBox.classList.remove('hidden');
      } catch (err) {
        errorMessage.textContent = err.message;
        errorBox.classList.remove('hidden');
      } finally {
        loadingBox.classList.add('hidden');
        btnInspect.disabled = false;
      }
    });

    function renderBreadcrumbs() {
      breadcrumbs.innerHTML = '';
      pathStack.forEach((entry, index) => {
        const isLast = index === pathStack.length - 1;
        const item = document.createElement('div');
        item.className = 'flex items-center space-x-1 flex-shrink-0';

        if (index > 0) {
          const sep = document.createElement('span');
          sep.className = 'text-slate-600 text-xs px-0.5';
          sep.textContent = '/';
          item.appendChild(sep);
        }

        if (isLast) {
          const span = document.createElement('span');
          span.className = 'text-white font-bold flex items-center space-x-1 bg-slate-800 px-2 py-1 rounded-lg';
          span.innerHTML = `<i class="fa-solid fa-folder-open text-brand text-xs"></i> <span class="max-w-[120px] truncate">${entry.name}</span>`;
          item.appendChild(span);
        } else {
          const btn = document.createElement('button');
          btn.className = 'text-slate-400 hover:text-brand transition flex items-center space-x-1 cursor-pointer py-1 px-1';
          btn.innerHTML = `<span class="max-w-[90px] truncate">${entry.name}</span>`;
          btn.onclick = () => {
            pathStack = pathStack.slice(0, index + 1);
            currentFolderNode = entry.node;
            filterInput.value = '';
            renderBreadcrumbs();
            renderFolder(currentFolderNode);
          };
          item.appendChild(btn);
        }

        breadcrumbs.appendChild(item);
      });

      // Auto scroll breadcrumbs para a direita no mobile
      breadcrumbs.scrollLeft = breadcrumbs.scrollWidth;
    }

    function renderFolder(folderNode) {
      fileListContainer.innerHTML = '';
      let children = folderNode.children || [];

      children = sortItems(children);

      // Botão "Voltar"
      if (pathStack.length > 1) {
        const backCard = document.createElement('div');
        if (currentViewMode === 'grid') {
          backCard.className = 'col-span-full bg-slate-900/60 hover:bg-slate-800/80 border border-slate-800/80 rounded-xl p-2.5 flex items-center space-x-2.5 cursor-pointer text-slate-300 active:scale-[0.99] transition touch-target';
          backCard.innerHTML = `
            <div class="w-7 h-7 rounded-lg bg-slate-800 flex items-center justify-center text-brand">
              <i class="fa-solid fa-arrow-turn-up text-xs"></i>
            </div>
            <span class="font-bold text-xs text-slate-200">.. Voltar pasta</span>
          `;
        } else {
          backCard.className = 'bg-slate-900/60 hover:bg-slate-800/80 border border-slate-800/80 rounded-xl p-3 flex items-center space-x-3 cursor-pointer text-slate-300 active:scale-[0.99] transition touch-target';
          backCard.innerHTML = `
            <div class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center text-brand">
              <i class="fa-solid fa-arrow-turn-up text-sm"></i>
            </div>
            <span class="font-bold text-xs text-slate-200">.. Voltar pasta</span>
          `;
        }
        backCard.onclick = () => {
          pathStack.pop();
          currentFolderNode = pathStack[pathStack.length - 1].node;
          renderBreadcrumbs();
          renderFolder(currentFolderNode);
        };
        fileListContainer.appendChild(backCard);
      }

      if (!children.length) {
        const empty = document.createElement('div');
        empty.className = 'col-span-full py-10 text-center text-slate-500 text-xs bg-slate-900/30 rounded-xl border border-dashed border-slate-800';
        empty.textContent = 'Esta pasta está vazia.';
        fileListContainer.appendChild(empty);
        return;
      }

      children.forEach(item => {
        const card = document.createElement('div');
        const iconClass = getFileIcon(item.name);
        const canPlay = isMedia(item.name);
        const fullStreamUrl = `${window.location.origin}/api/stream/${item.id}`;

        if (currentViewMode === 'grid') {
          // ================= MODO GRADE =================
          card.className = 'bg-darkcard border border-slate-800/80 rounded-xl p-2.5 flex flex-col justify-between transition hover:border-slate-700 active:scale-[0.98] select-none';

          if (item.isDirectory) {
            card.onclick = () => enterFolder(item.id);
            card.classList.add('cursor-pointer');
            card.innerHTML = `
              <div class="flex flex-col items-center text-center py-2 flex-1 justify-center">
                <div class="w-12 h-12 rounded-2xl bg-brand/10 border border-brand/20 flex items-center justify-center text-brand mb-2">
                  <i class="fa-solid fa-folder text-2xl"></i>
                </div>
                <div class="font-semibold text-xs text-slate-100 line-clamp-2 w-full break-words" title="${item.name}">${item.name}</div>
                <div class="text-[10px] text-slate-500 mt-1">${item.children ? item.children.length + ' item(ns)' : 'Pasta'}</div>
              </div>
            `;
          } else {
            card.innerHTML = `
              <div class="flex flex-col items-center text-center py-1.5 flex-1 justify-center min-w-0">
                <div class="w-11 h-11 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center mb-1.5 flex-shrink-0">
                  <i class="fa-solid ${iconClass} text-lg"></i>
                </div>
                <div class="font-medium text-[11px] text-slate-200 line-clamp-2 w-full break-words leading-tight" title="${item.name}">${item.name}</div>
                <div class="text-[10px] text-slate-400 font-mono mt-1">${item.formattedSize}</div>
              </div>

              <!-- Ações do Card em Grade -->
              <div class="flex items-center gap-1 pt-2 border-t border-slate-800/60 mt-1 justify-center">
                ${canPlay ? `
                  <button 
                    onclick="openPlayer('${item.id}', '${encodeURIComponent(item.name)}', '${item.subtitleId || ''}')" 
                    title="Assistir"
                    class="flex-1 py-1.5 bg-brand active:bg-rose-600 text-white rounded-lg text-[11px] font-medium transition flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-play text-[10px]"></i>
                    <span>Ver</span>
                  </button>
                ` : ''}

                <a 
                  href="/api/stream/${item.id}?download=1" 
                  download 
                  title="Baixar"
                  class="flex-1 py-1.5 bg-slate-800 active:bg-slate-750 text-slate-200 border border-slate-700/70 rounded-lg text-[11px] font-medium transition flex items-center justify-center space-x-1">
                  <i class="fa-solid fa-download text-[10px]"></i>
                  <span>Baixar</span>
                </a>
              </div>
            `;
          }

        } else {
          // ================= MODO LISTA =================
          card.className = 'bg-darkcard border border-slate-800/80 rounded-xl p-3 flex flex-col space-y-2.5 transition active:border-slate-700';

          if (item.isDirectory) {
            card.onclick = () => enterFolder(item.id);
            card.classList.add('cursor-pointer');
            card.innerHTML = `
              <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3 min-w-0 flex-1">
                  <div class="w-9 h-9 rounded-xl bg-brand/10 border border-brand/20 flex items-center justify-center text-brand flex-shrink-0">
                    <i class="fa-solid fa-folder text-base"></i>
                  </div>
                  <div class="min-w-0 flex-1">
                    <div class="font-semibold text-sm text-slate-100 truncate">${item.name}</div>
                    <div class="text-[11px] text-slate-500">${item.children ? item.children.length + ' item(ns)' : 'Pasta'}</div>
                  </div>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-slate-600 pl-2"></i>
              </div>
            `;
          } else {
            card.innerHTML = `
              <div class="flex items-start space-x-3 min-w-0">
                <div class="w-9 h-9 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center flex-shrink-0 mt-0.5">
                  <i class="fa-solid ${iconClass} text-sm"></i>
                </div>
                <div class="min-w-0 flex-1">
                  <div class="font-medium text-xs sm:text-sm text-slate-200 break-words leading-tight">${item.name}</div>
                  <div class="flex items-center space-x-2 mt-1 text-[11px] text-slate-400 font-mono">
                    <span>${item.formattedSize}</span>
                    ${item.subtitleId ? '<span class="text-[9px] bg-yellow-500/20 text-yellow-400 px-1 py-0.5 rounded font-sans">Legenda</span>' : ''}
                  </div>
                </div>
              </div>

              <div class="flex items-center gap-1.5 pt-1 border-t border-slate-800/60 justify-end">
                ${canPlay ? `
                  <button 
                    onclick="openPlayer('${item.id}', '${encodeURIComponent(item.name)}', '${item.subtitleId || ''}')" 
                    class="flex-1 sm:flex-none px-3 py-2 bg-brand active:bg-rose-600 text-white rounded-lg text-xs font-medium transition inline-flex items-center justify-center space-x-1.5 touch-target shadow-sm">
                    <i class="fa-solid fa-play text-xs"></i>
                    <span>Assistir</span>
                  </button>
                ` : ''}

                <button 
                  onclick="copyStreamLink('${fullStreamUrl}')" 
                  title="Copiar link VLC"
                  class="px-3 py-2 bg-slate-900 border border-slate-700/80 active:bg-slate-800 text-orange-400 rounded-lg text-xs font-medium transition inline-flex items-center justify-center space-x-1 touch-target">
                  <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                  <span>VLC</span>
                </button>

                <a 
                  href="/api/stream/${item.id}?download=1" 
                  download 
                  class="flex-1 sm:flex-none px-3 py-2 bg-slate-800 active:bg-slate-750 text-slate-200 border border-slate-700/70 rounded-lg text-xs font-medium transition inline-flex items-center justify-center space-x-1.5 touch-target">
                  <i class="fa-solid fa-download text-xs"></i>
                  <span>Baixar</span>
                </a>
              </div>
            `;
          }
        }

        fileListContainer.appendChild(card);
      });
    }

    window.enterFolder = (folderId) => {
      const targetFolder = (currentFolderNode.children || []).find(c => c.id === folderId);
      if (targetFolder) {
        pathStack.push({ name: targetFolder.name, node: targetFolder });
        currentFolderNode = targetFolder;
        renderBreadcrumbs();
        renderFolder(currentFolderNode);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    };

    window.copyStreamLink = (link) => {
      navigator.clipboard.writeText(link).then(() => {
        showToast('Link do stream copiado! Cole no VLC (Ctrl+N)');
      });
    };

    window.openPlayer = (id, encodedName, subtitleId) => {
      if (activePlyr) {
        activePlyr.destroy();
        activePlyr = null;
      }

      const name = decodeURIComponent(encodedName);
      modalTitle.textContent = name;
      const ext = name.split('.').pop().toLowerCase();
      currentStreamUrl = `${window.location.origin}/api/stream/${id}`;

      mediaPlayerWrapper.innerHTML = '';

      if (['mp3', 'wav', 'ogg'].includes(ext)) {
        const audio = document.createElement('audio');
        audio.id = 'playerTarget';
        audio.controls = true;
        audio.innerHTML = `<source src="${currentStreamUrl}" type="audio/${ext === 'mp3' ? 'mpeg' : ext}">`;
        mediaPlayerWrapper.appendChild(audio);

        activePlyr = new Plyr('#playerTarget', {
          controls: ['play', 'progress', 'current-time', 'duration', 'mute', 'volume']
        });
      } else {
        const video = document.createElement('video');
        video.id = 'playerTarget';
        video.controls = true;
        video.playsInline = true;

        let tracksHtml = '';
        if (subtitleId) {
          tracksHtml = `<track kind="captions" label="Português / Legenda" src="/api/subtitles/${subtitleId}" srclang="pt" default>`;
        }

        video.innerHTML = `<source src="${currentStreamUrl}" type="video/mp4">${tracksHtml}`;
        mediaPlayerWrapper.appendChild(video);

        activePlyr = new Plyr('#playerTarget', {
          controls: [
            'play-large', 'play', 'progress', 'current-time', 'duration', 
            'mute', 'volume', 'captions', 'settings', 'pip', 'fullscreen'
          ],
          speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] }
        });
      }

      mediaModal.classList.remove('hidden');
    };

    modalVlcBtn.addEventListener('click', () => {
      if (currentStreamUrl) {
        copyStreamLink(currentStreamUrl);
      }
    });

    function closePlayer() {
      if (activePlyr) {
        activePlyr.destroy();
        activePlyr = null;
      }
      mediaPlayerWrapper.innerHTML = '';
      mediaModal.classList.add('hidden');
    }

    closeModalBtn.addEventListener('click', closePlayer);
    mediaModal.addEventListener('click', (e) => {
      if (e.target === mediaModal) closePlayer();
    });
  </script>
</body>
</html>
